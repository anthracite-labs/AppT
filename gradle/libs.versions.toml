# Version catalog — S01 walking skeleton.
#
# Rules owned by docs/architecture/release.md:
#   * exact versions only; no `+` ranges, no dynamic versions, no snapshots;
#   * updates arrive as reviewed pull requests.
#
# S01 scope note: this catalog declares only what the S01 walking skeleton
# actually puts on a module graph. Later-slice artifacts (Firebase BOM,
# Play Billing, Play Integrity, Room, DataStore, WorkManager, Hilt,
# Credential Manager, OkHttp) are deliberately NOT declared here, so that a
# catalog alias can never be mistaken for an accepted S01 runtime dependency.
# Each arrives in the slice that first makes it real, with the license and
# provenance note release.md requires.

[versions]
agp = "8.9.1"
kotlin = "2.1.0"
androidx-core = "1.16.0"
androidx-activity = "1.10.1"
androidx-lifecycle = "2.8.7"
androidx-navigation = "2.8.9"
androidx-compose-bom = "2025.04.00"
androidx-benchmark = "1.3.4"
androidx-test-junit = "1.2.1"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-uiautomator = "2.3.0"
kotlinx-serialization = "1.8.0"
junit = "4.13.2"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
