# Version catalog — S01 walking skeleton.
#
# Rules owned by docs/architecture/release.md:
#   * exact versions only; no `+` ranges, no dynamic versions, no snapshots;
#   * updates arrive as reviewed pull requests.
#
# S01 scope note: this catalog declares only what the S01 walking skeleton
# actually puts on a module graph. Later-slice artifacts (Firebase BOM,
# Play Billing, Play Integrity, Room, DataStore, WorkManager, Hilt,
# Credential Manager, OkHttp) are deliberately NOT declared here, so that a
# catalog alias can never be mistaken for an accepted S01 runtime dependency.
# Each arrives in the slice that first makes it real, with the license and
# provenance note release.md requires.

[versions]
# AGP 9.x note (Issue #54): AGP 9 enables built-in Kotlin by default, so the
# org.jetbrains.kotlin.android plugin is NOT declared anywhere in this build —
# see docs/BUILD.md and the "Migrate to built-in Kotlin" Android documentation.
# The `kotlin` version below still versions the compose and serialization
# compiler plugins, which remain separate plugins under built-in Kotlin.
agp = "9.4.1"
kotlin = "2.4.20"
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.2"
androidx-compose-bom = "2026.09.00"
androidx-benchmark = "1.5.0"
androidx-test-junit = "1.3.0"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.0"
kotlinx-serialization = "1.11.0"
# S03 (Issue #79): Room for the device-local TvProfile row, DataStore for the
# typed preference keys, OkHttp for the live WebSocket session inside :samsung,
# and KSP for Room's annotation processing.
#   * room 2.8.5 (2026-09-09) is the latest stable 2.x line. Room 3.0.x moves to
#     the androidx.room3 package and the SQLiteDriver API surface, which is a
#     bigger change than a pairing slice needs; kapt is not an option because
#     AGP 9's built-in Kotlin has no kapt support.
#   * datastore-preferences 1.2.1 (2026-03-11) is the latest stable.
#   * okhttp 5.5.0 (2026-08-16) is the latest stable; the 5.x line uses
#     kotlin.time.Duration in its builder APIs.
#   * ksp 2.3.12 (2026-09-09) is the latest release and supports Kotlin 2.4.x
#     together with AGP 9's built-in Kotlin.
# Licenses: Apache-2.0. Publishers: Google (AndroidX), Square (OkHttp),
# Google (KSP), Maven Central / Google Maven.
room = "2.8.5"
androidx-datastore = "1.2.1"
okhttp = "5.5.0"
ksp = "2.3.12"
# S02 (Issue #73): coroutines for :samsung discovery and the Discovery
# ViewModel. 1.9.0 is exactly the version the AndroidX/Compose graph already
# resolves on :app, so declaring it adds no new artifact to the app graph; it
# becomes a direct, reviewed pin instead of a transitive one.
# License: Apache-2.0. Publisher: JetBrains (org.jetbrains.kotlinx), Maven Central.
kotlinx-coroutines = "1.9.0"
junit = "4.13.2"
robolectric = "4.17"
# detekt is AppT's Kotlin static-analysis floor (Issue #36). Pinned to the
# latest STABLE release: the 2.0.0 line is still pre-release as of this pin
# (2.0.0-alpha.6, 2026-08), and a pre-release analysis engine is not an
# acceptable floor for a security gate. 1.23.8 (2025-02-21) is the latest
# final 1.x release; it post-dates the Kotlin in this catalog and its embedded
# 2.0.21 compiler parses this codebase's source without type resolution, which
# is how the `detekt` task runs here.
# Updates arrive as reviewed pull requests, like every other pin.
detekt = "1.23.8"
# Spotless deterministic Kotlin formatting (Spotless + ktfmt) (Issue #56).
spotless = "7.0.2"
# Kover coverage report generation and verification floor (Issue #56).
kover = "0.9.5"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# S03 (Issue #79): the live WebSocket session inside :samsung. Declared only
# there: no networking library belongs in :app.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# S03 (Issue #79): the device-local TvProfile row (data.md#room).
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# S03 (Issue #79): typed preference keys (data.md#datastore).
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# No kotlin-android plugin entry: AGP 9's built-in Kotlin compiles Kotlin in
# every module that applies AGP (docs/BUILD.md, Issue #54).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# S03 (Issue #79): Room's annotation processor. AGP 9's built-in Kotlin has no
# kapt support, so KSP is the only supported processing path.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

