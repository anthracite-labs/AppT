# Gradle distribution pin (exact version; no range, no snapshot).
#
# `distributionSha256Sum` pins the distribution itself. It was taken from the
# official published `gradle-8.13-bin.zip.sha256` during wrapper generation and
# independently matches the Gradle release-checksums reference, so it is a
# verified fact rather than the unvalidated-provider-fact failure that
# docs/architecture/README.md warns against.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
