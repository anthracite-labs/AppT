# Gradle distribution pin (exact version; no range, no snapshot).
#
# `distributionSha256Sum` pins the distribution itself. It was taken from the
# official published `gradle-9.7.1-bin.zip.sha256` during wrapper generation
# and independently matches the Gradle release-checksums reference, so it is a
# verified fact rather than the unvalidated-provider-fact failure that
# docs/architecture/README.md warns against.
#
# Gradle 9.7.1 is the latest stable release and satisfies the AGP 9.4.x
# requirement of Gradle >= 9.6.0 (Issue #54).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
