# Gradle distribution pin (exact version; no range, no snapshot).
#
# `distributionSha256Sum` is intentionally left for the commit that also brings
# in the binary `gradle-wrapper.jar`: see `docs/BUILD.md` ("Gradle wrapper").
# Committing a checksum that has not been verified against the distribution
# would be exactly the unvalidated-provider-fact failure that
# docs/architecture/README.md warns against.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
