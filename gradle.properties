org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is deliberately off.
#
# The repository guards in gradle/guards.gradle.kts read other projects'
# resolved dependency graphs at execution time, which the configuration cache
# forbids. Rewriting those guards to be configuration-cache compatible is a
# build-performance change with real risk of weakening what they assert, and
# S01's job is to make the guards correct first. Turning the cache on is a
# reviewed follow-up, not a skeleton decision.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
