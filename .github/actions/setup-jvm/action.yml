# Repository-local composite setup action: the Android/JVM toolchain.
#
# Issue #88: runner filesystem state is never shared between jobs, so every
# Android verification job re-establishes its own toolchain. Centralising that
# here keeps the checkout posture and the toolchain pins in one reviewable
# place.
#
# The Gradle version is deliberately NOT passed to `gradle/actions/setup-gradle`.
# The committed wrapper (`gradle/wrapper/gradle-wrapper.properties` plus its
# `distributionSha256Sum`) is the Gradle version authority for this repository,
# so duplicating the version in workflow configuration would create a second
# place for it to drift.
name: Setup JVM
description: >-
  Checks out the repository without persisted credentials and sets up the
  pinned JDK plus Gradle through the committed wrapper.

inputs:
  java-version:
    description: >-
      JDK major version. JDK 17 is the minimum and default JDK for the pinned
      AGP 9.4.x (docs/BUILD.md).
    required: false
    default: '17'

runs:
  using: composite
  steps:
    - name: Check out
      # actions/checkout v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Set up JDK
      # actions/setup-java v6.0.1
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      # gradle/actions/setup-gradle v6.3.0
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-provider: 'basic'
