name: Setup JVM
description: >-
  Sets up the pinned JDK plus Gradle through the committed wrapper. Requires the
  repository to be checked out by the calling job first.

inputs:
  java-version:
    description: >-
      JDK major version. JDK 17 is the minimum and default JDK for the pinned
      AGP 9.4.x (docs/BUILD.md).
    required: false
    default: '17'

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-provider: 'basic'
