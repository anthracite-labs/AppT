name: Setup Node
description: >-
  Sets up the pinned Node.js runtime. Requires the repository to be checked out
  by the calling job first.

inputs:
  node-version:
    description: >-
      Node.js major version. backend/package.json `engines.node` owns this
      value; the workflow passes it so there is exactly one declaration per
      workflow file.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
