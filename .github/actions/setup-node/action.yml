# Repository-local composite setup action: the Node.js toolchain.
#
# Issue #88: runner filesystem state is never shared between jobs, so each
# verification job re-establishes its own toolchain. Centralising the pinned
# version here keeps one declaration per workflow file instead of repeating it
# in every job.
#
# NOTE — this action deliberately does NOT check out the repository. GitHub
# resolves a local action (`uses: ./.github/actions/...`) from the workspace on
# disk, so the caller must run `actions/checkout` *before* referencing this
# action; a checkout inside the composite would run too late to be found. Every
# job that uses this action therefore checks out explicitly first, which also
# makes the dependency visible in the job's step list.
name: Setup Node
description: >-
  Sets up the pinned Node.js runtime. Requires the repository to be checked out
  by the calling job first.

inputs:
  node-version:
    description: >-
      Node.js major version. backend/package.json `engines.node` owns this
      value; the workflow passes it so there is exactly one declaration per
      workflow file.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Set up Node
      # actions/setup-node v7.0.0
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
