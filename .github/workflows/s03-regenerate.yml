name: S03 dependency state regeneration

on:
  push:
    branches:
      - arena/01a0d990-appt

permissions:
  contents: write

concurrency:
  group: s03-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: basic

      - name: Regenerate reviewed dependency state and Room schema
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon \
            --write-verification-metadata sha256 \
            resolveAndLockAll --write-locks \
            :app:kspDebugKotlin \
            spotlessApply > /tmp/regen.log 2>&1
          code=$?
          set -e
          echo "regenerate exit code: $code"

          grep -E "^> Task .* FAILED$" /tmp/regen.log | sed 's/^/::error::REGEN-TASK /' \
            | sed -n '1,4p'
          grep -E "^e: " /tmp/regen.log | sed 's|:[0-9]*:[0-9]*:|::|' | sort -u \
            | sed 's/^/::error::REGEN-KOTLIN /' | sed -n '1,3p'
          grep -E "^w: " /tmp/regen.log | sed 's|:[0-9]*:[0-9]*:|::|' | sort -u \
            | sed 's/^/::warning::REGEN-WARN /' | sed -n '1,3p'
          tail -n 40 /tmp/regen.log | fold -w 2400 | sed -n '1,3p' \
            | sed 's/^/::error::REGEN-TAIL /'

          exit $code

      # Temporary diagnostic. The run log is not reachable from the environment this branch is
      # maintained in, so every strict-ciCheck failure is mirrored into workflow annotations,
      # which are readable through the REST API. `--continue` lets one run report every failure
      # instead of stopping at the first. GitHub caps annotations per step, so the findings are
      # split across steps. This workflow is removed before the branch is finished.
      - name: Strict ciCheck
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon --dependency-verification=strict ciCheck --continue \
            > /tmp/ci.log 2>&1
          code=$?
          set -e
          echo "ciCheck exit code: $code"

          grep -E "^> Task .* FAILED$" /tmp/ci.log | sed 's/^/::error::TASK /' | sed -n '1,6p'

          # Deduplicated so one root cause is one annotation, not one per line and column.
          grep -E "^e: " /tmp/ci.log | sed 's|:[0-9]*:[0-9]*:|::|' | sort -u \
            | sed 's/^/::error::KOTLIN /' | sed -n '1,6p'

          grep -E "^w: " /tmp/ci.log | sed 's|:[0-9]*:[0-9]*:|::|' | sort -u \
            | sed 's/^/::warning::KOTLIN-WARN /' | sed -n '1,4p'

          exit $code

      - name: Report test, detekt and lint findings
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          [ -f /tmp/ci.log ] || { echo "no ciCheck log"; exit 0; }

          awk '
            {
              if ($0 ~ /^> Task .* FAILED$/) { print "::error::TASK " $0 }
              else if ($0 ~ / FAILED$/) {
                t = $0; gsub(/^[ \t]+/, "", t); pending = t
              } else if (pending != "" && NF > 0) {
                l = $0; gsub(/^[ \t]+/, "", l)
                print "::error::TEST " pending " || " l
                pending = ""
              }
            }
          ' /tmp/ci.log | sed -n '1,6p'

          # detekt prints its findings to the console, which is where they land when the task
          # fails before writing its XML report.
          grep -E "^[^ ]+\.kt:[0-9]+:[0-9]+: " /tmp/ci.log \
            | sed 's/^/::error::DETEKT /' | sed -n '1,6p'

          for report in $(find . -path '*/build/reports/lint-results-debug.txt' 2>/dev/null); do
            grep -E ": (Error|Warning): " "$report" | sed "s|^|::error::LINT |" | sed -n '1,4p'
          done

      - name: Enforce generated-artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          while IFS= read -r path; do
            case "$path" in
              app/gradle.lockfile|samsung/gradle.lockfile|macrobenchmark/gradle.lockfile|settings-gradle.lockfile|gradle/verification-metadata.xml|app/schemas/*)
                ;;
              *)
                echo "::error::Unexpected regeneration change: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git add app/gradle.lockfile samsung/gradle.lockfile macrobenchmark/gradle.lockfile \
            settings-gradle.lockfile gradle/verification-metadata.xml
          if [ -d app/schemas ]; then
            git add app/schemas
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate S03 dependency state"
          git push
