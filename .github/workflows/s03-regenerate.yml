name: S03 dependency state regeneration

on:
  push:
    branches:
      - arena/01a0d990-appt

permissions:
  contents: write

concurrency:
  group: s03-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: basic

      # Temporary diagnostic. The run log is not reachable from the environment this branch is
      # maintained in, so the tail of both Gradle logs is mirrored into workflow annotations,
      # which are readable through the REST API. `--continue` lets one run report every failure
      # instead of stopping at the first. This workflow is removed before the branch is finished.
      - name: Regenerate dependency state and verify strictly
        shell: bash
        run: |
          set +e

          ./gradlew --no-daemon --write-verification-metadata sha256 \
            resolveAndLockAll --write-locks :app:kspDebugKotlin spotlessApply \
            > /tmp/regen.log 2>&1
          regen=$?

          ./gradlew --no-daemon --dependency-verification=strict ciCheck --continue \
            > /tmp/ci.log 2>&1
          ci=$?

          echo "regenerate exit: $regen ; ciCheck exit: $ci"

          emit() {
            tail -n 14 "$1" 2>/dev/null | fold -w 4000 \
              | while IFS= read -r line; do echo "::error::$2 $line"; done
          }
          emit /tmp/regen.log REGEN
          emit /tmp/ci.log CI

          [ "$regen" -eq 0 ] && [ "$ci" -eq 0 ]

      - name: Enforce generated-artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          while IFS= read -r path; do
            case "$path" in
              app/gradle.lockfile|samsung/gradle.lockfile|macrobenchmark/gradle.lockfile|settings-gradle.lockfile|gradle/verification-metadata.xml|app/schemas/*)
                ;;
              *)
                echo "::error::Unexpected regeneration change: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git add app/gradle.lockfile samsung/gradle.lockfile macrobenchmark/gradle.lockfile \
            settings-gradle.lockfile gradle/verification-metadata.xml
          if [ -d app/schemas ]; then
            git add app/schemas
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate S03 dependency state"
          git push
