name: S03 dependency state regeneration

on:
  push:
    branches:
      - arena/01a0d990-appt

permissions:
  contents: write
  checks: write

concurrency:
  group: s03-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: basic

      # Temporary diagnostic. The run log is not reachable from the environment this branch is
      # maintained in, so both Gradle logs are mirrored into workflow annotations, which are
      # readable through the REST API. Annotations are capped at ten per step, so the readout is
      # spread over the diagnose steps below rather than crammed into one. `--continue` lets one
      # run report every failure instead of stopping at the first. This workflow is removed
      # before the branch is finished.
      - name: Regenerate dependency state and verify strictly
        shell: bash
        run: |
          set +e
          set +o pipefail

          ./gradlew --no-daemon --write-verification-metadata sha256 \
            resolveAndLockAll --write-locks :app:kspDebugKotlin spotlessApply \
            > /tmp/regen.log 2>&1
          regen=$?

          ./gradlew --no-daemon --dependency-verification=strict ciCheck --continue \
            > /tmp/ci.log 2>&1
          ci=$?

          echo "regenerate exit: $regen ; ciCheck exit: $ci"
          echo "regen log bytes: $(wc -c < /tmp/regen.log) ; ci log bytes: $(wc -c < /tmp/ci.log)"
          printf '%s\n' "$regen" > /tmp/regen.exit
          printf '%s\n' "$ci" > /tmp/ci.exit

          [ "$regen" -eq 0 ] && [ "$ci" -eq 0 ]

      # ktfmt is the repository's formatter and the sandbox has no JDK, so the reformatting it
      # wants on the S03 sources is applied here and committed. The change set is restricted to
      # Kotlin sources and Gradle build scripts; anything else fails the step instead of being
      # committed.
      - name: Apply repository formatting to S03 sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- '*.kt' '*.gradle.kts'
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              */src/*.kt|*.gradle.kts) ;;
              *)
                echo "::error::Formatting touched an unexpected path: $path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply ktfmt to the S03 sources"
          git push

      # Each diagnose step emits at most nine annotations of at most 2000 characters, which is the
      # whole reason there are five of them.
      - name: Diagnose regeneration failure surface
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "::error::REGEN exit $(cat /tmp/regen.exit) bytes $(wc -c < /tmp/regen.log)"
          grep -n -A8 -E "^\* What went wrong|FAILURE:|BUILD FAILED|Execution failed for task|Could not |Cannot |Caused by:|OutOfMemory|Killed" /tmp/regen.log \
            | head -n 60 | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::REGEN $line"; done
          true

      - name: Diagnose regeneration log tail
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          tail -n 45 /tmp/regen.log | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::REGENTAIL $line"; done
          true

      - name: Diagnose strict ciCheck failure surface
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "::error::CI exit $(cat /tmp/ci.exit) bytes $(wc -c < /tmp/ci.log)"
          grep -n -A8 -E "^\* What went wrong|FAILURE:|BUILD FAILED|Execution failed for task|Could not |Cannot |Caused by:|OutOfMemory|Killed" /tmp/ci.log \
            | head -n 60 | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::CI $line"; done
          true

      - name: Diagnose strict ciCheck compiler diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          grep -nE "^e: |^w: " /tmp/ci.log | head -n 60 | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::CIDIAG $line"; done
          true

      - name: Diagnose strict ciCheck log tail
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          tail -n 45 /tmp/ci.log | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::CITAIL $line"; done
          true

      - name: Diagnose detekt findings
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          grep -nE "\\.kt:[0-9]+:[0-9]+" /tmp/ci.log \
            | grep -vE "^[0-9]+:[ew]: " | head -n 120 | head -c 16000 | fold -w 2000 | head -n 9 \
            | while IFS= read -r line; do echo "::error::DETEKT $line"; done
          true

      - name: Diagnose lint findings
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          grep -nE "Error:|Warning:|Lint found|lint-results|^/home/runner" /tmp/ci.log \
            | head -n 40 | head -c 16000 | fold -w 2000 | head -n 4 \
            | while IFS= read -r line; do echo "::error::LINT $line"; done
          python3 -c 'import json,glob; f=glob.glob("app/build/reports/lint-results-debug.sarif")+glob.glob("*/build/reports/lint-results-debug.sarif"); print("no sarif report found") if not f else [print(r.get("ruleId"),"|",l.get("physicalLocation",{}).get("artifactLocation",{}).get("uri","?"),"|",str(l.get("physicalLocation",{}).get("region",{}).get("snippet",{}).get("text","")).replace(chr(10)," / "),"|",r.get("message",{}).get("text","")) for run in (json.load(open(f[0])).get("runs",[]) if f else []) for r in run.get("results",[]) for l in r.get("locations",[])]' \
            2>&1 | head -n 60 | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::LINTSARIF $line"; done
          true

      - name: Diagnose unit-test failures
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          python3 -c 'import glob,xml.etree.ElementTree as ET;fs=glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml");print("no test reports found") if not fs else [print(tc.get("classname"),"::",tc.get("name"),"::",(f.get("message") or "")[:180],"::",(f.text or "")[:500].replace(chr(10)," / ")) for f0 in fs for tc in ET.parse(f0).getroot().iter("testcase") if (tc.find("failure") is not None or tc.find("error") is not None) for f in [tc.find("failure") if tc.find("failure") is not None else tc.find("error")]]' \
            2>&1 | head -n 80 | head -c 16000 | fold -w 2000 | head -n 8 \
            | while IFS= read -r line; do echo "::error::TESTS $line"; done
          true

      - name: Enforce generated-artifact allowlist
        if: always()
        shell: bash
        run: |
          set +e
          set +o pipefail
          git status --short
          while IFS= read -r path; do
            case "$path" in
              gradle.lockfile|app/gradle.lockfile|samsung/gradle.lockfile|macrobenchmark/gradle.lockfile|settings-gradle.lockfile|gradle/verification-metadata.xml|app/schemas/*)
                ;;
              *)
                echo "::error::Unexpected regeneration change: $path"
                ;;
            esac
          done < <(git status --porcelain=v1 | cut -c4-)

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git add gradle.lockfile app/gradle.lockfile samsung/gradle.lockfile \
            macrobenchmark/gradle.lockfile settings-gradle.lockfile \
            gradle/verification-metadata.xml
          if [ -d app/schemas ]; then
            git add app/schemas
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate S03 dependency state"
          git push
