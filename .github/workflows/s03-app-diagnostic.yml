# TEMPORARY Issue #79 diagnostic workflow — Contract Revision 3 (Issue #79
# comment 5858792845, refinements 5858915233 and 5858923549).
#
# This file is diagnostic infrastructure, not part of the S03 candidate. It is
# deleted before the finished candidate is returned, after which the permanent
# workflow inventory is again exactly verify.yml and codeql.yml.
#
# Objective: run the smallest hosted Android/JVM feedback loop for the current
# app-test correction — strict spotlessCheck plus the focused
# :app:testDebugUnitTest cluster — while preserving both exit signals, so a
# formatting failure cannot stop the runtime reproducer from executing.
#
# This is focused diagnostic evidence. It is not terminal verification and does
# not satisfy verify/gate.
#
# Scope guard: pushes to the active Arena session branch only; read-only
# permissions; no secrets; no artifacts; no dependency, lock, verification
# metadata, generated-state or source mutation; project-owned Gradle commands
# under strict dependency verification; its own concurrency group so it cannot
# cancel or be cancelled by verify.yml.

name: S03 app-test diagnostic (temporary)

on:
  push:
    branches:
      - arena/01a0e3cf-appt

permissions:
  contents: read

concurrency:
  group: s03-app-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.7.1'

jobs:
  app-diagnostic:
    name: Focused app-test diagnostic (not terminal verification)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: 'basic'

      # Exit codes are captured instead of failing the step, so signal 2 still
      # runs when signal 1 is red. The verdict step decides the workflow result.
      - name: Diagnostic signal 1 - strict spotlessCheck
        run: |
          set +e
          ./gradlew --no-daemon --dependency-verification=strict spotlessCheck
          rc=$?
          set -e
          echo "Diagnostic signal 1 (spotlessCheck) exit code: $rc"
          echo "spotless_rc=$rc" >> "$GITHUB_ENV"

      # Per-test results are republished as check-run annotations because this
      # environment cannot download job logs or artifacts, so the annotation
      # stream is the only channel back. Read-only: it parses the JUnit XML that
      # Gradle already wrote.
      - name: Diagnostic signal 2 - focused app test cluster
        run: |
          set +e
          ./gradlew --no-daemon --dependency-verification=strict :app:testDebugUnitTest \
            --tests '*ActiveRemoteHostTest' \
            --tests '*PairingViewModelTest' \
            --tests '*RemoteViewModelTest' \
            --tests '*PairingToFirstControlFlowTest' \
            --tests '*TestScopeSettleTest' 2>&1 | tee /tmp/focused.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "Diagnostic signal 2 (focused cluster) exit code: $rc"
          echo "focused_rc=$rc" >> "$GITHUB_ENV"
          python3 - /tmp/focused.log <<'PY'
          import glob
          import re
          import sys
          import xml.etree.ElementTree as ET

          log_path = sys.argv[1]
          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          failures = []
          total = 0
          per_file = []
          for path in files:
              root = ET.parse(path).getroot()
              count = 0
              for case in root.iter('testcase'):
                  total += 1
                  count += 1
                  cls = case.get('classname') or ''
                  name = case.get('name') or ''
                  for node in case:
                      if node.tag not in ('failure', 'error'):
                          continue
                      message = ' '.join((node.get('message') or '').split())
                      body = (node.text or '').splitlines()
                      frames = [' '.join(line.split()) for line in body if ' at ' in line or 'at ' == line.strip()[:3]]
                      failures.append((cls, name, node.tag, message, frames))
              per_file.append('%s=%d' % (path.rsplit('TEST-', 1)[-1].replace('.xml', ''), count))

          def flat(text, limit=1000):
              return ' '.join(text.split())[:limit]

          print('JUnit XML files: %d, tests executed: %d, failing: %d' % (len(files), total, len(failures)))
          print('::notice title=Tests executed per class::%s' % flat(', '.join(per_file), 900))
          if failures:
              names = ', '.join('%s.%s' % (c.split('.')[-1], n) for c, n, _, _, _ in failures)
              print('::error title=Failing tests::%s' % flat(names))
              for cls, name, kind, message, frames in failures[:10]:
                  print('::error title=%s::%s [%s] %s' % (cls, name, kind, flat(message)))
                  own = [f for f in frames if 'dev.anthracite' in f][:3]
                  top = frames[:8]
                  print('::notice title=Frames %s::%s' % (name, flat(' || '.join(own + top), 1200)))
              if len(failures) > 10:
                  print('::error title=Remaining failures::%s' % flat(', '.join('%s.%s' % (c, n) for c, n, _, _, _ in failures[10:])))
          else:
              if files:
                  print('Every test in the focused cluster passed.')
              else:
                  print('No JUnit XML was produced, so the tests never ran. Build output follows.')
                  try:
                      with open(log_path, encoding='utf-8', errors='replace') as handle:
                          lines = handle.read().splitlines()
                  except OSError:
                      lines = []
                  interesting = [l for l in lines if re.search(r'^e: |FAILED$|Execution failed for task|What went wrong|^\s*>\s', l)]
                  for line in interesting[-12:]:
                      print('::error title=Build output::%s' % flat(line))
          PY

      # Widening to the full app unit-test scope happens only when the focused
      # reproducer is green, as the contract requires. A Kotlin compilation
      # failure may legitimately stop the tests from running; that shows up as a
      # non-zero focused exit code rather than a hidden pass.
      - name: Full app unit scope, only when the focused cluster is green
        if: always() && env.focused_rc == '0'
        run: |
          set +e
          ./gradlew --no-daemon --dependency-verification=strict :app:testDebugUnitTest
          rc=$?
          set -e
          echo "Diagnostic full app unit scope exit code: $rc"
          echo "app_scope_rc=$rc" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          total = failing = skipped = 0
          classes = []
          for path in files:
              root = ET.parse(path).getroot()
              tests = int(root.get('tests') or 0)
              total += tests
              failing += int(root.get('failures') or 0) + int(root.get('errors') or 0)
              skipped += int(root.get('skipped') or 0)
              classes.append('%s=%d' % ((root.get('name') or path).split('.')[-1], tests))
          print('::notice title=Full app unit scope::classes=%d tests=%d failing=%d skipped=%d' % (len(files), total, failing, skipped))
          print('::notice title=Classes in the full app unit scope::%s' % ', '.join(classes)[:1200])
          PY

      - name: Diagnostic verdict
        if: always()
        run: |
          spotless_rc="${spotless_rc:-missing}"
          focused_rc="${focused_rc:-missing}"
          scope_rc="${app_scope_rc:-skipped}"
          echo "spotlessCheck:       $spotless_rc"
          echo "focused app cluster: $focused_rc"
          echo "full app unit scope: $scope_rc"
          if [ "$spotless_rc" = "0" ] && [ "$focused_rc" = "0" ] && [ "$scope_rc" = "0" ]; then
            echo "Diagnostic run green. Focused diagnostic evidence only, not terminal verification."
          else
            echo "::error title=Diagnostic run red::spotlessCheck=$spotless_rc focused=$focused_rc appScope=$scope_rc"
            exit 1
          fi
