name: s02-regenerate (temporary, deleted before PR)

# One-shot helper for S02 (Issue #73): the implementation sandbox has no JDK or
# Android SDK, so lockfile + verification-metadata regeneration and the focused
# verification commands run here. The sandbox cannot download artifacts or
# logs, so the job also emits its result summary and the regenerated patch
# (gzip + base64) as check-run annotations, which the API does expose.
# This file is removed before the S02 pull request is opened (same pattern as
# the deleted bootstrap workflow described in docs/BUILD.md).

on:
  push:
    branches:
      - arena/01a0d558-appt

permissions:
  contents: read

concurrency:
  group: s02-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate locks and run S02 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      # The proof step: canonical strict verification (Issue #73) on the tree
      # exactly as committed. No `|| true`; pipefail keeps Gradle's exit code.
      - name: Strict canonical verification (committed tree)
        id: strict
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict \
            ciCheck :samsung:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug appTGuards \
            --continue 2>&1 | tee /tmp/strict.log

      # Diagnostics only, when the proof step failed: produce the formatting /
      # lock / metadata patch to apply. Never counted as verification.
      - name: Regenerate lockfiles (diagnostic)
        if: steps.strict.outcome != 'success'
        run: |
          ./gradlew --no-daemon --dependency-verification=lenient resolveAndLockAll --write-locks > /tmp/locks.log 2>&1 || echo "lock regeneration exited $?" >> /tmp/locks.log

      - name: Regenerate verification metadata and apply formatting (diagnostic)
        if: steps.strict.outcome != 'success'
        run: |
          ./gradlew --no-daemon --write-verification-metadata sha256 spotlessApply ciCheck :samsung:testDebugUnitTest --continue > /tmp/metadata.log 2>&1 || echo "metadata/format exited $?" >> /tmp/metadata.log

      - name: Capture regenerated diff
        if: always()
        run: |
          git diff --binary > /tmp/regenerated.patch
          git diff --stat | tail -n 40

      - name: Summarize results
        if: always()
        run: |
          mkdir -p s02-results
          python3 - <<'PY'
          import glob, re, pathlib, xml.etree.ElementTree as ET
          out = []
          strict = pathlib.Path('/tmp/strict.log').read_text(errors='replace') if pathlib.Path('/tmp/strict.log').exists() else ''
          lines = strict.splitlines()
          out.append('== strict: build result ==')
          out += [l for l in lines if re.search(r'BUILD (SUCCESSFUL|FAILED)', l)]
          out.append('== strict: task failures ==')
          out += [l for l in lines if l.startswith('> Task') and 'FAILED' in l]
          out.append('== strict: compiler errors/warnings ==')
          out += [l for l in lines if re.match(r'^[ew]: ', l)][:300]
          out.append('== strict: what went wrong ==')
          for i, l in enumerate(lines):
              if 'What went wrong' in l:
                  out += lines[i:i+25]
          out.append('== strict: detekt / guards / spotless / kover lines ==')
          out += [l for l in lines if re.search(r'detekt|\.kt:\d+:\d+|guard|violat|Rule violated|coverage|spotless', l, re.I)][:300]
          out.append('== unit test failures ==')
          for f in glob.glob('*/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  out.append(f'unparsable {f}: {e}'); continue
              for tc in root.iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      text = (fail.text or '')[:3000]
                      out.append(f"FAIL {tc.get('classname')}.{tc.get('name')}: {fail.get('message','')[:500]}\n{text}")
          out.append('== unit test totals ==')
          per_class = {}
          for mod in ('app', 'samsung'):
              t = f_ = e = sk = 0
              for f in glob.glob(f'{mod}/build/test-results/testDebugUnitTest/*.xml'):
                  try:
                      r = ET.parse(f).getroot()
                  except Exception:
                      continue
                  t += int(r.get('tests', 0)); f_ += int(r.get('failures', 0)); e += int(r.get('errors', 0)); sk += int(r.get('skipped', 0))
                  per_class[r.get('name')] = (int(r.get('tests', 0)), int(r.get('failures', 0)) + int(r.get('errors', 0)), int(r.get('skipped', 0)))
              out.append(f'{mod}: tests={t} failures={f_} errors={e} skipped={sk}')
          for name in sorted(per_class):
              tests, bad, sk = per_class[name]
              out.append(f'  {name}: tests={tests} failed={bad} skipped={sk}')
          out.append('== kover files ==')
          out += sorted(glob.glob('**/reports/kover/**/*.xml', recursive=True))
          out.append('== lint issues ==')
          for f in glob.glob('*/build/reports/lint-results-*.xml') + glob.glob('*/build/intermediates/lint_intermediate_text_report/**/*.txt', recursive=True):
              if f.endswith('.xml'):
                  try:
                      for issue in ET.parse(f).getroot().iter('issue'):
                          loc = issue.find('location')
                          where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else ''
                          out.append(f"{f}: {issue.get('severity')} {issue.get('id')} {where} {issue.get('message')}")
                  except Exception as e:
                      out.append(f'unparsable {f}: {e}')
          out.append('== kover ==')
          for f in sorted(glob.glob('**/reports/kover/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(f).getroot()
                  for c in root.findall('counter'):
                      out.append(f"{f} {c.get('type')} missed={c.get('missed')} covered={c.get('covered')}")
                  for pkg in root.iter('package'):
                      for c in pkg.findall('counter'):
                          if c.get('type') == 'LINE':
                              out.append(f"  {pkg.get('name')} LINE missed={c.get('missed')} covered={c.get('covered')}")
              except Exception as e:
                  out.append(f'unparsable {f}: {e}')
          pathlib.Path('s02-results/summary.txt').write_text('\n'.join(out) + '\n')
          PY
          tail -c 200000 /tmp/strict.log > s02-results/strict-tail.log || true
          tail -c 100000 /tmp/metadata.log > s02-results/metadata-tail.log || true
          tail -c 30000 /tmp/locks.log > s02-results/locks-tail.log || true

      - name: Emit summary as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          text = pathlib.Path('s02-results/summary.txt').read_text(errors='replace')
          size = 4000
          chunks = [text[i:i + size] for i in range(0, len(text), size)][:30]
          levels = ['notice'] * 10 + ['warning'] * 10 + ['error'] * 10
          for n, chunk in enumerate(chunks):
              print(f"::{levels[n]} title=summary {n + 1}/{len(chunks)}::{esc(chunk)}")
          PY

      - name: Emit regenerated patch as annotations
        if: always()
        run: |
          gzip -9 -c /tmp/regenerated.patch | base64 -w0 > /tmp/patch.b64 || true
          python3 - <<'PY'
          import pathlib
          data = pathlib.Path('/tmp/patch.b64').read_text().strip()
          size = 4000
          chunks = [data[i:i + size] for i in range(0, len(data), size)]
          print(f"::notice title=patch meta::chunks={len(chunks)} b64len={len(data)}")
          levels = ['notice'] * 9 + ['warning'] * 10
          for n, chunk in enumerate(chunks[:19]):
              print(f"::{levels[n]} title=patch {n + 1}/{len(chunks)}::{chunk}")
          PY

      - name: Verdict
        if: always()
        run: |
          status=0
          if [ "${{ steps.strict.outcome }}" != "success" ]; then
            echo "::error title=verdict::strict canonical verification failed"; status=1
          fi
          if ! grep -q "BUILD SUCCESSFUL" /tmp/strict.log || grep -q "BUILD FAILED" /tmp/strict.log; then
            echo "::error title=verdict::strict log is not BUILD SUCCESSFUL"; status=1
          fi
          if [ -s /tmp/regenerated.patch ]; then
            echo "::error title=verdict::regeneration changed committed files"; status=1
          fi
          grep -E "BUILD (SUCCESSFUL|FAILED)" /tmp/strict.log || true
          exit $status

      - name: Upload results
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s02-results
          path: |
            /tmp/*.log
            /tmp/regenerated.patch
            app/build/reports/**
            samsung/build/reports/**
            app/build/test-results/**
            samsung/build/test-results/**
            build/reports/kover/**
          if-no-files-found: warn
          retention-days: 3
