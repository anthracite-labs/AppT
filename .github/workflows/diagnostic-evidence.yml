# TEMPORARY diagnostic evidence — REMOVE BEFORE ANY CANDIDATE REPORT.
#
# One push-triggered run that reproduces the failing app-unit tests, detekt,
# and lint, and surfaces each concrete finding as check-run annotations, because
# the diagnose surfacer only carries the Gradle "what went wrong" tail and the
# report artifacts are not readable from this workspace. Deleted immediately
# after use.

name: diagnostic-evidence

on:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  diagnostic-evidence:
    name: diagnostic-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: '17'

      - name: Run the app unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest > /tmp/tests.log 2>&1
          echo "test exit status: $?"
          exit 0

      - name: Run detekt and lint
        run: |
          set +e
          ./gradlew :app:detekt :app:lintDebug > /tmp/static.log 2>&1
          echo "static exit status: $?"
          exit 0

      - name: Surface failing tests
        if: always()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not paths:
              print("::error title=evidence::no app test result XML was produced")
          for path in paths:
              tree = ET.parse(path)
              for suite in tree.iter("testsuite"):
                  for case in suite.iter("testcase"):
                      failures = list(case.iter("failure")) + list(case.iter("error"))
                      for failure in failures:
                          name = "{} > {}".format(suite.get("name"), case.get("name"))
                          message = (failure.get("message") or "").replace("\n", " ")[:300]
                          print("::error title=test failure::{} :: {}".format(name, message))
                          text = (failure.text or "").strip().splitlines()[:6]
                          for line in text:
                              print("::error title=stack::  {}".format(line.strip()[:220]))

      - name: Surface detekt and lint findings
        if: always()
        shell: python
        run: |
          import os
          import re

          emitted = 0
          log = ""
          for path in ("/tmp/static.log",):
              if os.path.exists(path):
                  log += open(path, errors="replace").read()
          for line in log.splitlines():
              if re.search(r"\.kt:[0-9]+:[0-9]+", line) and "[" in line:
                  print("::error title=detekt::{}".format(line.strip()[:400]))
                  emitted += 1
          for report in ("app/build/reports/lint-results-debug.txt",):
              if os.path.exists(report):
                  for line in open(report, errors="replace").read().splitlines():
                      if line.startswith("Error:"):
                          print("::error title=lint::{}".format(line.strip()[:400]))
                          emitted += 1
          if emitted == 0:
              print("::notice title=evidence::no detekt or lint finding lines matched")
