# TEMPORARY — Issue #68 supply-chain regeneration. DELETE BEFORE MERGE.
#
# Purpose: the Arena development sandbox has no JDK and no egress to
# services.gradle.org, repo1.maven.org or dl.google.com (docs/BUILD.md, "Where
# the Android verification runs"), so the verification metadata for the new
# buildscript classpath constraints cannot be regenerated there. This workflow
# runs the two documented regeneration commands (docs/BUILD.md) on a canonical
# GitHub-hosted runner and commits only the generated artifacts back.
#
# Contract (.agents/ARENA-DISPATCH.md, "Supply-chain regeneration"):
#   * immutable action commit-SHA pins, matching verify.yml;
#   * minimum permissions: contents: write only, so the job can commit back;
#   * no repository secrets;
#   * writes only gradle/verification-metadata.xml, the Gradle lockfiles and a
#     Spotless reformat of build.gradle.kts;
#   * the regenerated state is then proven with the canonical strict command
#     `./gradlew --no-daemon --dependency-verification=strict ciCheck`;
#   * branch-scoped, and removed before merge.
name: temporary-issue-68-supply-chain-regen

on:
  push:
    branches:
      - arena/01a0d4ae-appt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue68-regen-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.7.1'

jobs:
  regenerate:
    name: Regenerate and prove supply-chain artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: 'basic'

      - name: Regenerate verification metadata and lockfiles
        run: |
          set -o pipefail
          chmod +x ./gradlew
          # docs/BUILD.md: Spotless formatting, then the two regeneration
          # commands. `help` forces configuration so the buildscript classpath
          # (where the Issue #68 constraints live) is resolved and recorded;
          # resolveAndLockAll resolves every subproject configuration.
          ./gradlew --no-daemon spotlessApply 2>&1 | tee /tmp/spotless.log
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            help resolveAndLockAll --write-locks 2>&1 | tee /tmp/regen.log

      - name: Prove the regenerated state under strict verification
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict ciCheck \
            2>&1 | tee /tmp/cicheck.log

      - name: Record buildscript classpath ownership evidence
        run: |
          set -o pipefail
          ./gradlew --no-daemon buildEnvironment 2>&1 | tee /tmp/buildenv.log
          for coordinate in \
            'org.bitbucket.b_c:jose4j' \
            'org.eclipse.jgit:org.eclipse.jgit' \
            'org.jdom:jdom2' \
            'com.android.tools.build:bundletool' \
            'com.android.tools.build.jetifier:jetifier-processor' \
            'com.diffplug.spotless:spotless-lib-extra'
          do
            echo "=== ${coordinate} ==="
            grep -n -F "${coordinate}" /tmp/buildenv.log || echo "NOT PRESENT"
          done

      - name: Run the Issue #68 guard against the regenerated tree
        run: node tools/security/enforce-gradle-tooling-constraints.mjs

      - name: Show generated diff
        run: |
          set -euo pipefail
          git --no-pager status --porcelain
          git --no-pager diff --stat

      - name: Commit regenerated artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paths=(
            gradle/verification-metadata.xml
            settings-gradle.lockfile
            build.gradle.kts
          )
          while IFS= read -r lockfile; do
            paths+=("${lockfile}")
          done < <(git ls-files '*.gradle.lockfile')

          if git diff --quiet -- "${paths[@]}"; then
            echo "No regenerated artifact changed; nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'chore(supply-chain): regenerate verification metadata and locks for Issue #68 constraints [skip ci]'
          git push

      - name: Upload regeneration evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-68-regen-evidence
          path: |
            /tmp/buildenv.log
            /tmp/regen.log
            /tmp/cicheck.log
            /tmp/spotless.log
          if-no-files-found: warn
          retention-days: 14
