# AppT manual maintenance — the only repository-owned maintenance workflow.
#
# One first-party workflow_dispatch workflow replaces the former
# export-dependabot.yml, cleanup-workflow-runs.yml and
# purge-actions-caches.yml (Issue #52). Every operation remains manual-only:
# no push, pull-request, schedule, repository-dispatch or chained automatic
# trigger can execute any of them, and each dispatched run executes exactly
# the one selected operation (the other jobs are skipped, so a dispatch costs
# one job, as before).
#
# Least privilege is enforced at job level, so each selected operation receives
# only the permissions it needs:
#   export-dependabot:     vulnerability-alerts: read (plus contents: read)
#   cleanup-workflow-runs: actions: write (plus contents: read)
#   purge-actions-caches:  actions: write (plus contents: read)
# The destructive `actions: write` is never granted to the export job, and the
# export job is never widened to cover the destructive operations.
#
# The implementations are first-party (gh api + jq), as before; no third-party
# cleanup or export action is added.

name: Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Maintenance operation to run (exactly one per dispatch)'
        required: true
        type: choice
        options:
          - export-dependabot
          - cleanup-workflow-runs
          - purge-actions-caches

# Only what every job shares; each job below raises exactly its own needs.
permissions:
  contents: read

# One group per operation: dispatching different operations at the same time
# stays possible (as with the separate former workflows), while a repeat of
# the same operation queues instead of cancelling a destructive one that is
# mid-flight.
concurrency:
  group: maintenance-${{ github.event.inputs.operation }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Read-only export of the open Dependabot alerts as a Markdown + JSON
  # artifact. Not a CI gate; it exists so the alert position is reviewable on
  # demand.
  # ---------------------------------------------------------------------------
  export-dependabot:
    if: github.event.inputs.operation == 'export-dependabot'
    name: Export Dependabot alerts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - name: Fetch open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api             --paginate             --slurp             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100"             | jq 'add // []'             > dependabot-alerts.json

      - name: Generate Markdown report
        run: |
          set -euo pipefail

          TOTAL="$(jq 'length' dependabot-alerts.json)"
          CRITICAL="$(jq '[.[] | select(.security_advisory.severity == "critical")] | length' dependabot-alerts.json)"
          HIGH="$(jq '[.[] | select(.security_advisory.severity == "high")] | length' dependabot-alerts.json)"
          MODERATE="$(jq '[.[] | select(.security_advisory.severity == "moderate")] | length' dependabot-alerts.json)"
          LOW="$(jq '[.[] | select(.security_advisory.severity == "low")] | length' dependabot-alerts.json)"

          cat > dependabot-alerts.md <<EOF
          # AppT Dependabot Alert Export

          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Repository: \`${GITHUB_REPOSITORY}\`

          Source commit: \`${GITHUB_SHA}\`

          ## Summary

          | Severity | Open alerts |
          | --- | ---: |
          | Critical | ${CRITICAL} |
          | High | ${HIGH} |
          | Moderate | ${MODERATE} |
          | Low | ${LOW} |
          | **Total** | **${TOTAL}** |

          ## Alerts

          EOF

          jq -r '
            def severity_rank:
              if . == "critical" then 0
              elif . == "high" then 1
              elif . == "moderate" then 2
              elif . == "low" then 3
              else 4
              end;

            sort_by(
              (.security_advisory.severity | severity_rank),
              .dependency.package.name,
              .number
            )
            | .[]
            |
            "### Alert #\(.number) — \(.dependency.package.name)\n\n" +
            "- **Severity:** \(.security_advisory.severity)\n" +
            "- **Package:** `\(.dependency.package.name)`\n" +
            "- **Ecosystem:** \(.dependency.package.ecosystem)\n" +
            "- **Manifest:** `\(.dependency.manifest_path)`\n" +
            "- **Scope:** \(.dependency.scope // "unknown")\n" +
            "- **Relationship:** \(.dependency.relationship // "unknown")\n" +
            "- **GHSA:** \(.security_advisory.ghsa_id)\n" +
            "- **CVE:** \(.security_advisory.cve_id // "None")\n" +
            "- **CVSS:** \(.security_advisory.cvss.score // "Not listed")\n" +
            "- **Vulnerable versions:** `\(.security_vulnerability.vulnerable_version_range)`\n" +
            "- **First patched version:** `" +
              (.security_vulnerability.first_patched_version.identifier // "No patched version listed") +
            "`\n" +
            "- **Summary:** " +
              ((.security_advisory.summary // "No summary") | gsub("\n"; " ")) +
            "\n" +
            "- **GitHub:** \(.html_url)\n"
          ' dependabot-alerts.json >> dependabot-alerts.md

      - name: Add report to workflow summary
        run: |
          cat dependabot-alerts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Dependabot export
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependabot-alerts
          path: |
            dependabot-alerts.md
            dependabot-alerts.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Destructive: deletes older COMPLETED workflow runs, keeping the newest run
  # per workflow and preserving every older run that is still active. Manual
  # only.
  # ---------------------------------------------------------------------------
  cleanup-workflow-runs:
    if: github.event.inputs.operation == 'cleanup-workflow-runs'
    name: Keep latest run per workflow
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Find duplicate completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api             --paginate             --slurp             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             | jq '[.[].workflow_runs[]]'             > all-runs.json

          jq -r '
            group_by(.workflow_id)
            | .[]
            | sort_by(.created_at, .id)
            | reverse
            | .[0]
            | [
                (.workflow_id | tostring),
                .name,
                (.id | tostring),
                .status,
                (.conclusion // ""),
                .created_at,
                (.head_branch // ""),
                .event
              ]
            | @tsv
          ' all-runs.json > kept-runs.tsv

          jq -r --arg current "${GITHUB_RUN_ID}" '
            group_by(.workflow_id)
            | .[]
            | sort_by(.created_at, .id)
            | reverse
            | .[1:][]
            | select(.status == "completed")
            | select((.id | tostring) != $current)
            | [
                (.id | tostring),
                (.workflow_id | tostring),
                .name,
                (.conclusion // ""),
                .created_at,
                (.head_branch // ""),
                .event
              ]
            | @tsv
          ' all-runs.json > delete-runs.tsv

          jq -r --arg current "${GITHUB_RUN_ID}" '
            group_by(.workflow_id)
            | .[]
            | sort_by(.created_at, .id)
            | reverse
            | .[1:][]
            | select(.status != "completed")
            | select((.id | tostring) != $current)
            | [
                (.id | tostring),
                (.workflow_id | tostring),
                .name,
                .status,
                .created_at,
                (.head_branch // ""),
                .event
              ]
            | @tsv
          ' all-runs.json > active-older-runs.tsv

          total="$(jq 'length' all-runs.json)"
          workflows="$(jq 'group_by(.workflow_id) | length' all-runs.json)"
          duplicates="$(wc -l < delete-runs.tsv | tr -d ' ')"
          active_older="$(wc -l < active-older-runs.tsv | tr -d ' ')"

          {
            echo "### Workflow run cleanup plan"
            echo
            echo "- Total runs found: **${total}**"
            echo "- Distinct workflows: **${workflows}**"
            echo "- Older completed runs to delete: **${duplicates}**"
            echo "- Older active runs preserved: **${active_older}**"
            echo
            echo "The newest run for every workflow is always preserved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deleted=0
          failed=0

          while IFS=$'\t' read -r run_id workflow_id name conclusion created_at head_branch event; do
            [ -n "$run_id" ] || continue

            echo "Deleting run ${run_id}: workflow=${name} workflow_id=${workflow_id} conclusion=${conclusion} branch=${head_branch} event=${event} created=${created_at}"

            success=false
            for attempt in 1 2 3; do
              if gh api                 --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              then
                success=true
                break
              fi

              echo "Delete attempt ${attempt} failed for run ${run_id}."
              sleep $((attempt * 2))
            done

            if [ "$success" = "true" ]; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::error::Failed to delete workflow run ${run_id} after 3 attempts."
            fi
          done < delete-runs.tsv

          {
            echo
            echo "### Cleanup result"
            echo
            echo "- Deleted older completed runs: **${deleted}**"
            echo "- Failed deletions: **${failed}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Destructive: deletes every GitHub Actions cache in the repository. Manual
  # only.
  # ---------------------------------------------------------------------------
  purge-actions-caches:
    if: github.event.inputs.operation == 'purge-actions-caches'
    name: Delete all GitHub Actions caches
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: List current caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api             --paginate             --slurp             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100"             | jq '[.[].actions_caches[]]'             > actions-caches.json

          count="$(jq 'length' actions-caches.json)"
          bytes="$(jq '[.[].size_in_bytes] | add // 0' actions-caches.json)"

          jq -r '
            sort_by(.last_accessed_at, .id)
            | reverse
            | .[]
            | [
                (.id | tostring),
                .key,
                .ref,
                (.size_in_bytes | tostring),
                .created_at,
                .last_accessed_at
              ]
            | @tsv
          ' actions-caches.json > caches-to-delete.tsv

          {
            echo "### Actions cache purge plan"
            echo
            echo "- Caches found: **${count}**"
            echo "- Bytes scheduled for deletion: **${bytes}**"
            echo
            echo "This manually dispatched run will delete every GitHub Actions cache currently present in the repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete all caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deleted=0
          failed=0
          deleted_bytes=0

          while IFS=$'\t' read -r cache_id key ref size_bytes created_at last_accessed_at; do
            [ -n "$cache_id" ] || continue

            echo "Deleting cache ${cache_id}: key=${key} ref=${ref} size=${size_bytes} created=${created_at} last_accessed=${last_accessed_at}"

            success=false
            for attempt in 1 2 3; do
              if gh api                 --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2026-03-10"                 "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
              then
                success=true
                break
              fi

              echo "Delete attempt ${attempt} failed for cache ${cache_id}."
              sleep $((attempt * 2))
            done

            if [ "$success" = "true" ]; then
              deleted=$((deleted + 1))
              deleted_bytes=$((deleted_bytes + size_bytes))
            else
              failed=$((failed + 1))
              echo "::error::Failed to delete Actions cache ${cache_id} after 3 attempts."
            fi
          done < caches-to-delete.tsv

          {
            echo
            echo "### Cache purge result"
            echo
            echo "- Deleted caches: **${deleted}**"
            echo "- Deleted bytes: **${deleted_bytes}**"
            echo "- Failed deletions: **${failed}**"
            echo
            echo "Future workflow runs may create fresh caches again as their configured cache steps execute."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
