# AppT GitHub Actions maintenance — manual-only, destructive, and confirmed.
#
# Topology (Issue #88)
# -------------------
# This is the only destructive workflow in the repository. It exists because
# routine retention settings own ordinary housekeeping but cannot express a
# deliberate "start clean" operation, and because a purge has to be auditable
# rather than a hidden side effect of verification.
#
# Guarantees:
#   * manual only — the sole trigger is `workflow_dispatch`. There is no
#     `schedule`, no `push`, no `pull_request`, so nothing is ever cleaned up
#     automatically;
#   * destructive only after an explicit confirmation input equal to `PURGE`;
#   * it cancels every other active workflow run, waits for those runs to
#     settle, deletes every Actions cache in the repository, deletes every
#     workflow run except the run executing now, and then verifies that no
#     cache and no other run remains;
#   * `actions: write` is granted to this job alone. `verify`, `diagnose`,
#     `codeql` and `agent-control` never receive deletion privileges, and no
#     verification workflow contains automatic history deletion.
#
# The destructive sequence lives in `tools/ci/purge-actions.mjs` so it is
# reviewable in one file and provable against a fake API
# (`tools/ci/test/purge-actions.test.mjs`) without deleting real history.

name: maintenance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type PURGE (exactly) to confirm. Every Actions cache and every
          workflow run except this one will be deleted.
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    name: Actions maintenance purge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Confirm destructive intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PURGE" ]; then
            echo "::error title=Maintenance refused::Type PURGE (exactly) in the confirm input to run the destructive Actions maintenance purge."
            echo "Nothing was cancelled, deleted, or modified."
            exit 1
          fi
          {
            echo "### Actions maintenance purge — confirmed"
            echo
            echo "This run will:"
            echo
            echo "1. cancel every other active workflow run;"
            echo "2. wait for those runs to settle;"
            echo "3. delete every Actions cache in the repository;"
            echo "4. delete every workflow run except this one;"
            echo "5. verify that no cache and no other run remains."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report what the purge would touch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tools/ci/purge-actions.mjs --dry-run

      - name: Cancel, wait, delete caches, delete runs, verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tools/ci/purge-actions.mjs \
            --settle-timeout-minutes 20 \
            --poll-interval-seconds 15

      - name: Record the verified end state
        run: |
          {
            echo "### Actions maintenance purge — verified"
            echo
            echo "No Actions cache and no other workflow run remains in the repository."
          } >> "$GITHUB_STEP_SUMMARY"
