# AppT continuous integration — the S01 floor.
#
# docs/architecture/release.md#pull-request-checks owns this list. S01 wires
# the checks that are real in the walking skeleton; the remaining numbered
# checks (fixture redaction grep, environment guard, emulator suites, release
# artifact comparison, signing identity) arrive with the slices that make them
# meaningful.
#
# Every external action is pinned to an immutable commit SHA, with the
# human-readable release tag retained in a trailing comment, so CI cannot be
# retargeted by a moving tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A red required check is not mergeable. Nothing here is `continue-on-error`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning — runs on every PR and every push to main (release.md #14).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the full history
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          # Full history so the scan covers the tree and every commit in the
          # change, not just the tip.
          fetch-depth: 0

      - name: Set up Node
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Secret scanner self-test
        run: node --test "tools/secret-scan/test/*.test.mjs"

      # Scans the whole tree on every run, plus the diff of a pull request.
      # The scanner is first-party and dependency-free: see the provenance note
      # at the top of tools/secret-scan/secret-scan.mjs.
      - name: Scan the tree and the diff for secrets
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            node tools/secret-scan/secret-scan.mjs --base "${{ github.event.pull_request.base.sha }}"
          else
            node tools/secret-scan/secret-scan.mjs
          fi

  # ---------------------------------------------------------------------------
  # Android floor.
  # ---------------------------------------------------------------------------
  android:
    name: Android build, tests, lint and guards
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up JDK
        # actions/setup-java v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # gradle/actions/setup-gradle v4.4.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          # Installs the pinned Gradle CLI and puts it on PATH, which is what
          # materializes the wrapper below. The version matches the pin in
          # gradle/wrapper/gradle-wrapper.properties exactly.
          gradle-version: '8.13'

      - name: Materialize the pinned Gradle wrapper
        id: wrapper
        continue-on-error: true
        # gradlew and gradle-wrapper.jar are generated, not committed; see
        # docs/BUILD.md. The wrapper is generated in an empty scratch directory
        # and copied in, because running `gradle wrapper` inside the project
        # would configure the AppT build (and resolve AGP) before the wrapper
        # that is supposed to run that build even exists.
        run: |
          set -x
          {
            which gradle || true
            gradle --version || true
            if [ ! -f ./gradlew ]; then
              scratch="$(mktemp -d)"
              # Gradle 8.13 refuses to run in a directory that is not a build,
              # so the scratch directory needs an (empty) settings file.
              : > "$scratch/settings.gradle.kts"
              ( cd "$scratch" && gradle wrapper --gradle-version 8.13 --distribution-type bin --stacktrace )
              ls -la "$scratch" "$scratch/gradle/wrapper" || true
              cp "$scratch/gradlew" ./gradlew
              cp "$scratch/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
              chmod +x ./gradlew
            fi
            ./gradlew --version
          } > wrapper.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat wrapper.log

      - name: Report wrapper materialization
        if: always()
        run: |
          # Annotations are capped, so surface only the diagnostic tail:
          # error/exception lines plus the last few lines of output.
          grep -iE "error|exception|caused by|what went wrong|not found|denied|no such" wrapper.log \
            | tail -n 6 | while IFS= read -r line; do echo "::error::WRAPPER: $line"; done
          tail -n 4 wrapper.log | while IFS= read -r line; do echo "::error::TAIL: $line"; done
          test "${{ steps.wrapper.outputs.status }}" = "0"

      # Strict dependency verification and dependency locking are only
      # meaningful once the generated lockfiles and checksum metadata are
      # committed. This step states plainly whether the repository is
      # bootstrapped, so a missing bootstrap reads as a bootstrap problem
      # rather than as a confusing checksum failure. See docs/BUILD.md.
      - name: Supply-chain bootstrap state
        id: supply_chain
        run: |
          set -euo pipefail
          bootstrapped=true
          if ! grep -q '<component ' gradle/verification-metadata.xml; then
            echo '::warning::gradle/verification-metadata.xml has no component checksums yet.'
            bootstrapped=false
          fi
          if ! ls app/gradle.lockfile >/dev/null 2>&1; then
            echo '::warning::Dependency lockfiles are not committed yet.'
            bootstrapped=false
          fi
          echo "bootstrapped=$bootstrapped" >> "$GITHUB_OUTPUT"

      - name: Assemble debug, unit tests, lint and dependency lock check (strict verification)
        if: steps.supply_chain.outputs.bootstrapped == 'true'
        run: >-
          ./gradlew --no-daemon
          --verify-dependencies
          assembleDebug lintDebug testDebugUnitTest dependencyLockCheck

      - name: Assemble debug, unit tests and lint, and write the supply-chain metadata
        id: bootstrap_build
        continue-on-error: true
        if: steps.supply_chain.outputs.bootstrapped != 'true'
        # Resolves the graph once and generates the lockfiles and the SHA-256
        # verification metadata, which are then uploaded for review and commit.
        # The build itself must still pass here, so this path never hides a
        # broken build; it only defers checksum enforcement to the commit that
        # adds the reviewed checksums.
        run: |
          {
            ./gradlew --no-daemon --write-locks resolveAndLockAll --stacktrace &&
            ./gradlew --no-daemon --write-verification-metadata sha256 \
              assembleDebug lintDebug testDebugUnitTest :macrobenchmark:assembleBenchmark &&
            ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest dependencyLockCheck
          } > build.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat build.log

      - name: Report bootstrap build
        if: always() && steps.supply_chain.outputs.bootstrapped != 'true'
        run: |
          grep -iE "^e: |error:|Caused by|Could not resolve|No matching|not found|Unresolved|> Task .* FAILED|required by|locking" build.log \
            | grep -v "^\s*at " | head -n 9 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
          test "${{ steps.bootstrap_build.outputs.status }}" = "0"

      - name: Upload generated supply-chain metadata for review
        if: steps.supply_chain.outputs.bootstrapped != 'true'
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-bootstrap
          path: |
            gradle/verification-metadata.xml
            **/gradle.lockfile
          if-no-files-found: warn
          retention-days: 14

      - name: Privacy, supply-chain and module guards
        # noTelemetryDependency, adIdAbsentFromManifest,
        # noProductionModuleDependsOnBenchmark, the permission allowlist, the
        # Firestore/crash-reporting checks, the :samsung boundary, the no-Log
        # rule, the no-sync-record rule and the version-catalog pin check.
        run: ./gradlew --no-daemon appTGuards

      - name: ':app dependency insight — no Firestore client'
        run: >-
          ./gradlew --no-daemon :app:dependencyInsight
          --configuration debugRuntimeClasspath --dependency firestore
          | tee firestore-insight.txt
          && ! grep -qiE '^(com\.google\.firebase|com\.google\.cloud).*firestore' firestore-insight.txt

      - name: ':app dependency insight — no Crashlytics'
        run: >-
          ./gradlew --no-daemon :app:dependencyInsight
          --configuration debugRuntimeClasspath --dependency crashlytics
          | tee crashlytics-insight.txt
          && ! grep -qi 'crashlytics:' crashlytics-insight.txt

      - name: ':macrobenchmark compiles as a test-only module'
        run: ./gradlew --no-daemon :macrobenchmark:assembleBenchmark

      - name: Upload reports
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/outputs/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Backend package (release.md #11b). Always package-prefixed from the root.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend typecheck, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Node
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci is the only install: it fails if package-lock.json is missing or
      # out of step with package.json.
      - name: Install from the committed lockfile
        run: npm ci --prefix backend

      - name: Typecheck
        run: npm run typecheck --prefix backend

      - name: Lint
        run: npm run lint --prefix backend

      - name: Format check
        run: npm run format:check --prefix backend

      - name: Test
        run: npm test --prefix backend
