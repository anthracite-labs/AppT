# One-shot supply-chain bootstrap (manual dispatch only).
#
# Generates the artifacts that S01 requires to be COMMITTED, and which can only
# be produced by a real Gradle resolution against google() and mavenCentral():
#
#   * the Gradle wrapper (gradlew, gradlew.bat, gradle-wrapper.jar)
#   * the per-module dependency lockfiles
#   * gradle/verification-metadata.xml with SHA-256 component checksums
#
# It commits them to the branch it is dispatched on so they enter review as a
# normal diff. It is NOT part of the CI gate: `ci.yml` fails if these artifacts
# are absent, and never regenerates them. Delete this workflow once S01 is
# accepted and the artifacts are in the tree.

name: Supply-chain bootstrap

on:
  # workflow_dispatch is the intended trigger, but the agent identity that
  # authored this branch cannot create dispatch events, so the job also runs on
  # push to this one branch. It is a no-op once the artifacts exist (see the
  # `needs_bootstrap` guard below), so it costs one skipped job per push and
  # disappears entirely when the branch is merged and this file is deleted.
  workflow_dispatch:
  push:
    branches: [arena/01a0cc2b-appt]

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate and commit wrapper, lockfiles and checksums
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      # Self-disabling: once the artifacts are committed this workflow does
      # nothing, so it can never fight the committed state or regenerate it.
      - name: Decide whether bootstrap is needed
        id: need
        run: |
          set -euo pipefail
          needed=false
          for required in gradlew gradle/wrapper/gradle-wrapper.jar \
            gradle/verification-metadata.xml app/gradle.lockfile \
            samsung/gradle.lockfile macrobenchmark/gradle.lockfile
          do
            [ -f "$required" ] || needed=true
          done
          if [ -f gradle/verification-metadata.xml ] && \
             ! grep -q '<component ' gradle/verification-metadata.xml; then
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "bootstrap needed: $needed"

      - name: Set up JDK
        if: steps.need.outputs.needed == 'true'
        # actions/setup-java v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.need.outputs.needed == 'true'
        # gradle/actions/setup-gradle v4.4.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.13'

      - name: Materialize the pinned Gradle wrapper
        if: steps.need.outputs.needed == 'true'
        # Generated in an empty scratch build, because `gradle wrapper` run in
        # this repository would configure the AppT build (and resolve AGP)
        # before the wrapper that is meant to run that build exists.
        run: |
          set -euxo pipefail
          scratch="$(mktemp -d)"
          : > "$scratch/settings.gradle.kts"
          ( cd "$scratch" && gradle wrapper --gradle-version 8.13 --distribution-type bin )
          cp "$scratch/gradlew" ./gradlew
          cp "$scratch/gradlew.bat" ./gradlew.bat
          mkdir -p gradle/wrapper
          cp "$scratch/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --version

      - name: Record the distribution checksum
        if: steps.need.outputs.needed == 'true'
        # Pins the Gradle distribution itself by checksum, verified against the
        # published .sha256 rather than trusted from memory.
        run: |
          set -euxo pipefail
          sum="$(curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256)"
          test -n "$sum"
          if grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i "s|^distributionSha256Sum=.*|distributionSha256Sum=$sum|" gradle/wrapper/gradle-wrapper.properties
          else
            printf 'distributionSha256Sum=%s\n' "$sum" >> gradle/wrapper/gradle-wrapper.properties
          fi
          grep distributionSha256Sum gradle/wrapper/gradle-wrapper.properties

      - name: Build once without verification, to surface real build errors first
        id: firstbuild
        continue-on-error: true
        if: steps.need.outputs.needed == 'true'
        # If the project does not build, that must be the reported failure,
        # not a downstream checksum error.
        run: |
          ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest \
            :macrobenchmark:assembleBenchmark > first.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 200 first.log

      - name: Report first build
        if: always() && steps.need.outputs.needed == 'true'
        # Run-log download is unavailable to the authoring agent, so compile
        # errors are mirrored into annotations, which the API does expose.
        run: |
          # Print the 'What went wrong' block, which carries the actual reason.
          awk '/\* What went wrong:/{f=1} f{print} /\* Try:/{f=0}' first.log \
            | grep -v "^\s*at " | head -n 14 \
            | while IFS= read -r line; do echo "::error::WHY: $line"; done
          # Group every distinct compiler error into as few annotations as
          # possible (the annotation list is capped), so one CI cycle reports
          # the whole error set rather than a handful at a time.
          grep -E "^e: " first.log | sed 's|^e: file://[^ ]*/AppT/||' | sort -u > errs.txt || true
          echo "distinct compiler errors: $(wc -l < errs.txt)"
          cat errs.txt
          paste -sd '\n' errs.txt | split -l 12 - /tmp/errchunk_ || true
          for chunk in /tmp/errchunk_*; do
            [ -f "$chunk" ] || continue
            echo "::error::ERRORS:%0A$(sed 's/$/%0A/' "$chunk" | tr -d '\n')"
          done
          test "${{ steps.firstbuild.outputs.status }}" = "0"

      - name: Generate dependency lockfiles
        if: steps.need.outputs.needed == 'true'
        run: ./gradlew --no-daemon --write-locks resolveAndLockAll

      - name: Generate SHA-256 dependency verification metadata
        if: steps.need.outputs.needed == 'true'
        # Gradle creates verification-metadata.xml itself; seeding it with an
        # empty <components/> would activate verification with zero known
        # checksums and fail every resolution.
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug lintDebug testDebugUnitTest dependencyLockCheck \
            :macrobenchmark:assembleBenchmark appTGuards
          grep -c '<component ' gradle/verification-metadata.xml

      - name: Prove the committed state passes strict verification
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --verify-dependencies \
            assembleDebug lintDebug testDebugUnitTest dependencyLockCheck
          ./gradlew --no-daemon --verify-dependencies appTGuards
          ./gradlew --no-daemon --verify-dependencies :macrobenchmark:assembleBenchmark

      - name: Commit the generated artifacts
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            gradle/verification-metadata.xml
          git add -f ./*/gradle.lockfile || true
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit \
            -m 'Commit Gradle wrapper, dependency lockfiles and verification metadata' \
            -m 'Generated by the one-shot supply-chain bootstrap workflow, which also proved the committed state passes strict dependency verification.' \
            -m 'Refs #27'
          git push origin HEAD:${{ github.ref_name }}
