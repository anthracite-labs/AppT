# AppT dependency review — the pull-request gate on newly introduced
# dependencies.
#
# This complements, and does not replace, the existing supply-chain floor:
# committed Gradle lockfiles, gradle/verification-metadata.xml under
# --dependency-verification=strict, the committed Gradle wrapper with a pinned
# distributionSha256Sum, backend/package-lock.json with npm ci as the only
# install, and reviewed version-catalog changes. Those controls answer "is this
# the artifact we reviewed?"; this check answers "does the thing we are about to
# add have a known vulnerability?".
#
# Every external action is pinned to an immutable commit SHA with the release tag
# in a trailing comment (docs/architecture/release.md).

name: Dependency review

on:
  pull_request:
    branches: [main]

# dependency-review-action reads the diff and posts its report as a pull-request
# comment, so it needs exactly these two and nothing more.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the base and head of the change
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          # The action diffs base against head, so both must be present.
          fetch-depth: 0

      # Severity threshold: LOW.
      #
      # Rationale (Issue #36 asks for a defensible security-oriented threshold):
      #   * AppT ships no telemetry, analytics or crash-reporting SDK and keeps
      #     television data device-local, so the dependency graph is small and
      #     every addition is already a reviewed, deliberate act. A graph that
      #     small can afford the strictest practical threshold.
      #   * Dependency updates arrive as reviewed pull requests and are never
      #     auto-merged (release.md: "Silent upgrades are not allowed"), so a
      #     low-severity failure costs one review decision rather than an
      #     unattended break.
      #   * `moderate` or higher would let a known-vulnerable version land and be
      #     re-litigated later, which is the opposite of the fail-closed posture
      #     the rest of this repository takes.
      #
      # A deliberate non-goal: no `deny-licenses` policy is configured here. The
      # final AppT source license is an explicit pre-public-release human gate
      # (docs/architecture/release.md#two-external-gates, docs/HARVEST.md), and
      # encoding a license policy in CI now would pre-empt that decision. License
      # provenance stays a reviewed pull-request note, as release.md requires.
      - name: Dependency review
        # actions/dependency-review-action v5.0.0
        #
        # v5.0.0's only breaking change over v4 is a move to the node24 runtime,
        # which needs Actions Runner >= v2.327.1; GitHub-hosted ubuntu-24.04
        # runners are well past that.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low
          # Name the check explicitly so a red dependency review is legible in
          # the checks list rather than appearing as a generic job.
          comment-summary-in-pr: always
