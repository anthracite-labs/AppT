# AppT focused diagnostics — permanent, manual, and never terminal.
#
# Topology
# --------
# The permanent home of focused implementation feedback: one mode per
# meaningful failure domain, invokable on demand by a human or by the trusted
# agent-control bridge, with no temporary per-issue workflow YAML.
#
# Non-terminal by construction:
#   * every mode is `workflow_dispatch` only, so a diagnostic run is never
#     produced by a pull-request or push event;
#   * no job here is named `gate`, so a diagnostic run cannot produce the
#     `verify / gate` status that default-branch protection requires;
#   * the run summary states plainly that the result is implementation
#     feedback and does not satisfy terminal repository verification.
#
# A finished candidate is verified by `verify` (full run), never by this file.
#
# Focus
# -----
# Every mode accepts an optional `focus` input that narrows that mode without
# widening it. `tools/ci/diagnose-focus.mjs` owns what "narrow" means per mode
# and returns the exact argv vector to run, so the focus value is data rather
# than command text: it can become a selector, never a command, a flag, or a
# task the mode does not own.
#
#   * an empty `focus` reproduces the mode's existing, unfocused command exactly;
#   * a non-empty `focus` narrows only within the mode, through the underlying
#     tool's native selector or a finite allowlist of sub-responsibilities the
#     mode already owns;
#   * anything else — a wrong shape, a foreign prefix, a sub-responsibility the
#     mode does not own, a leading dash, a control character — fails closed
#     before anything runs;
#   * the run summary records the mode and the effective focus.
#
# A focused diagnostic is still implementation feedback only. Full `verify` is
# unchanged by anything here.

name: diagnose

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          One diagnostic mode, or a comma-separated set of modes to run
          concurrently. Valid modes: app-unit, samsung-unit, android-static,
          android-build, backend. Every diagnostic is implementation feedback
          only and does not satisfy verify / gate.
        required: true
        default: 'app-unit'
        type: string
      expected_sha:
        description: >-
          Commit SHA the dispatched ref was expected to resolve to. Set by the
          agent-control bridge; every mode job hard-fails before doing any work
          if the ref no longer resolves to it. Leave empty for an ordinary
          manual dispatch.
        required: false
        default: ''
      target_ref:
        description: >-
          Branch the agent-control bridge resolved the head from. Validated
          against expected_sha by trusted logic before any work runs. Leave
          empty for an ordinary manual dispatch.
        required: false
        default: ''
      focus:
        description: >-
          Optional narrowing for a single selected mode. Leave empty to run the
          whole mode. Multi-mode selections must leave focus empty and run each
          selected mode whole. Single-mode focus syntax is unchanged: a Gradle
          test class or method pattern for unit modes, a named sub-check for
          static/build modes, and static:/test: selectors for backend.
        required: false
        default: ''

# Cache authorization is separate from GITHUB_TOKEN permissions. These
# trusted-default-branch dispatches execute validated PR code; provider-scoped
# cache tokens must never let that code save into the default branch cache.
cache-mode: read

permissions:
  contents: read

# The validated selection and focus are part of a run's identity. The raw input
# is safe to use only as an opaque concurrency key; trusted selection validation
# still happens before any target-controlled checkout or execution.
concurrency:
  group: >-
    diagnose-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.focus }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Validate the requested mode set on the dispatch anchor before any selected
  # job checks out or executes target-controlled code.
  # ---------------------------------------------------------------------------
  select-modes:
    name: Validate diagnostic selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      modes: ${{ steps.select.outputs.modes }}
      selection_kind: ${{ steps.select.outputs.selection_kind }}
      app_unit: ${{ steps.select.outputs.app_unit }}
      samsung_unit: ${{ steps.select.outputs.samsung_unit }}
      android_static: ${{ steps.select.outputs.android_static }}
      android_build: ${{ steps.select.outputs.android_build }}
      backend: ${{ steps.select.outputs.backend }}
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate selected diagnostic modes
        id: select
        env:
          MODE_INPUT: ${{ inputs.mode }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          node tools/ci/diagnose-focus.mjs \
            --mode "$MODE_INPUT" \
            --focus "$FOCUS" \
            --selection-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # app-unit — :app JVM/Robolectric tests only.
  # ---------------------------------------------------------------------------
  app-unit:
    name: app-unit
    needs: select-modes
    if: needs.select-modes.outputs.app_unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve the diagnostic focus
        env:
          MODE: app-unit
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          # The focus is resolved by the reviewed module and written as an argv
          # vector, one argument per line. The value is therefore data: it cannot
          # become a command, a flag, or a task this mode does not own. An
          # invalid, cross-mode or malformed focus fails here, before anything
          # runs.
          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - name: Run :app unit and Robolectric tests
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/app-unit.log || {
              echo "::error title=app-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/app-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/app-unit.log || true
              exit 1
          }

      - name: Upload app unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-app-unit-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # samsung-unit — :samsung unit tests only.
  # ---------------------------------------------------------------------------
  samsung-unit:
    name: samsung-unit
    needs: select-modes
    if: needs.select-modes.outputs.samsung_unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve the diagnostic focus
        env:
          MODE: samsung-unit
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - name: Run :samsung unit tests
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/samsung-unit.log || {
              echo "::error title=samsung-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/samsung-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/samsung-unit.log || true
              exit 1
          }

      - name: Upload Samsung unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-samsung-unit-reports
          path: |
            samsung/build/reports/tests/test/**
            samsung/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # android-static — Android Lint, detekt and appTGuards.
  # ---------------------------------------------------------------------------
  android-static:
    name: android-static
    needs: select-modes
    if: needs.select-modes.outputs.android_static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve the diagnostic focus
        env:
          MODE: android-static
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - name: Run Android static and policy verification
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/android-static.log || {
              echo "::error title=android-static Failure::$(grep -A 10 "\* What went wrong:" /tmp/android-static.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/android-static.log || true
              exit 1
          }

      - name: Upload Lint and detekt reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-android-static-reports
          path: |
            app/build/reports/lint-results*
            samsung/build/reports/lint-results*
            app/build/reports/detekt/**
            samsung/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # android-build — AppT debug assembly and release-boundary checks.
  # ---------------------------------------------------------------------------
  android-build:
    name: android-build
    needs: select-modes
    if: needs.select-modes.outputs.android_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Resolve the diagnostic focus
        env:
          MODE: android-build
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - name: Run Android build
        env:
          APPT_BUILD_SHA: ${{ steps.assert-target.outputs.sha || github.sha }}
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/android-build.log || {
              echo "::error title=android-build Failure::$(grep -A 10 "\* What went wrong:" /tmp/android-build.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/android-build.log || true
              exit 1
          }

      - name: Upload debug APK
        if: success()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appt-debug-${{ inputs.expected_sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # backend — the whole backend verification interface (static plus tests).
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    needs: select-modes
    if: needs.select-modes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve the diagnostic focus
        env:
          MODE: backend
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - name: Install from committed lockfile
        run: npm ci --prefix backend

      - name: Run backend verification interface
        run: |
          set -euo pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}"

  # ---------------------------------------------------------------------------
  # Non-terminal record. This job exists so every diagnostic run states, on the
  # run itself, what it is and what it is not.
  # ---------------------------------------------------------------------------
  feedback-report:
    name: Diagnostic report (not terminal verification)
    needs:
      - select-modes
      - app-unit
      - samsung-unit
      - android-static
      - android-build
      - backend
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record that this run is not terminal verification
        env:
          MODES: ${{ needs.select-modes.outputs.modes }}
          FOCUS: ${{ inputs.focus }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ inputs.expected_sha || github.sha }}
          TARGET_REF: ${{ inputs.target_ref || github.ref }}
        run: |
          set -euo pipefail

          # The effective focus is what the mode jobs actually ran with. An empty
          # focus means the whole mode, and is recorded as such rather than being
          # left blank, so the summary always states what this run covered.
          if [ -n "$FOCUS" ]; then
            effective_focus="$FOCUS"
          else
            effective_focus="<none: full selected modes>"
          fi

          {
            echo "### diagnose: ${MODES}"
            echo
            echo "- modes: \`${MODES}\`"
            echo "- focus: \`${effective_focus}\`"
            echo "- commit: \`${TARGET_SHA}\` (\`${TARGET_REF}\`)"
            echo "- run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
            echo
            echo "This dispatch is **implementation feedback only**. It is **not** terminal"
            echo "repository verification and it does **not** satisfy \`verify / gate\`."
            echo "Terminal verification of a finished candidate is a full run of"
            echo "\`verify\` (workflow \`verify\`, job \`gate\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "diagnose/${MODES} (focus: ${effective_focus}): implementation feedback only; not terminal verification."
