# AppT focused diagnostics — permanent, manual, and never terminal.
#
# Topology (Issue #88)
# -------------------
# This workflow replaces the retired `samsung-targeted` dispatch mode of
# `verify.yml`. It is the permanent home of focused implementation feedback:
# one mode per meaningful failure domain, invokable on demand by a human or by
# the trusted agent-control bridge, with no temporary per-issue workflow YAML.
#
# Non-terminal by construction:
#   * every mode is `workflow_dispatch` only, so a diagnostic run is never
#     produced by a pull-request or push event;
#   * no job here is named `gate`, so a diagnostic run cannot produce the
#     `verify / gate` status that default-branch protection requires;
#   * the run summary states plainly that the result is implementation
#     feedback and does not satisfy terminal repository verification.
#
# A finished candidate is verified by `verify` (full run), never by this file.
#
# Focus (Issue #88, human revision)
# ---------------------------------
# Every mode accepts an optional `focus` input that narrows that mode without
# widening it. `tools/ci/diagnose-focus.mjs` owns what "narrow" means per mode
# and returns the exact argv vector to run, so the focus value is data rather
# than command text: it can become a selector, never a command, a flag, or a
# task the mode does not own.
#
#   * an empty `focus` reproduces the mode's existing, unfocused command exactly;
#   * a non-empty `focus` narrows only within the mode, through the underlying
#     tool's native selector or a finite allowlist of sub-responsibilities the
#     mode already owns;
#   * anything else — a wrong shape, a foreign prefix, a sub-responsibility the
#     mode does not own, a leading dash, a control character — fails closed
#     before anything runs;
#   * the run summary records the mode and the effective focus.
#
# A focused diagnostic is still implementation feedback only. Full `verify` is
# unchanged by anything here.

name: diagnose

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Focused diagnostic mode. Every mode is implementation feedback only
          and does not satisfy verify / gate.
        required: true
        default: 'app-unit'
        type: choice
        options:
          - app-unit
          - samsung-unit
          - android-static
          - android-build
          - backend-static
          - backend-test
          - backend
          - device
      expected_sha:
        description: >-
          Commit SHA the dispatched ref was expected to resolve to. Set by the
          agent-control bridge; every mode job hard-fails before doing any work
          if the ref no longer resolves to it. Leave empty for an ordinary
          manual dispatch.
        required: false
        default: ''
      target_ref:
        description: >-
          Branch the agent-control bridge resolved the head from. Validated
          against expected_sha by trusted logic before any work runs. Leave
          empty for an ordinary manual dispatch.
        required: false
        default: ''
      focus:
        description: >-
          Optional narrowing within the selected mode. Leave empty to run the
          whole mode. The accepted form depends on the mode: a Gradle test
          class or method pattern for the unit modes, a named sub-check for the
          static and build modes, file:/name: for the backend modes, and
          class:/package:/method: for the device mode. Anything else fails
          closed before any work runs.
        required: false
        default: ''

# Cache authorization is separate from GITHUB_TOKEN permissions. These
# trusted-default-branch dispatches execute validated PR code; provider-scoped
# cache tokens must never let that code save into the default branch cache.
cache-mode: read

permissions:
  contents: read

# The focus is part of a run's identity, so two different foci on the same ref
# and mode do not cancel each other.
concurrency:
  group: >-
    diagnose-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.focus }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # app-unit — :app JVM/Robolectric tests only.
  # ---------------------------------------------------------------------------
  app-unit:
    name: app-unit
    if: inputs.mode == 'app-unit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the dispatch anchor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For a bridge dispatch this is the default branch the workflow ran
          # from, so the assertion below and the local composite actions it uses
          # are trusted repository content. The dispatch target is checked out
          # afterwards, once it has been validated.
          persist-credentials: false

      - name: Assert the dispatch target
        id: assert-target
        if: inputs.expected_sha != ''
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}
          target-ref: ${{ inputs.target_ref }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Resolve the diagnostic focus
        env:
          MODE: ${{ inputs.mode }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail

          # The focus is resolved by the reviewed module and written as an argv
          # vector, one argument per line. The value is therefore data: it cannot
          # become a command, a flag, or a task this mode does not own. An
          # invalid, cross-mode or malformed focus fails here, before anything
          # runs.
          node tools/ci/diagnose-focus.mjs --mode "$MODE" --focus "$FOCUS" \
            > "${RUNNER_TEMP}/diagnose-args"

          if [ -n "$FOCUS" ]; then
            echo "::notice title=${MODE} focused::${MODE} narrowed to: ${FOCUS}"
          else
            echo "::notice::${MODE} runs its full mode; no focus was supplied."
          fi

      - &gradle-warm-find
        name: Find previous PR-local Gradle warm state
        id: gradle-warm
        if: steps.assert-target.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.assert-target.outputs.pr-number }}
        run: |
          set -euo pipefail

          artifact_name="appt-gradle-local-cache-pr-${PR_NUMBER}"
          echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"

          run_ids="$(
            gh api "repos/${REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[].workflow_run.id' \
              2>/dev/null || true
          )"

          found=''
          for run_id in ${run_ids}; do
            run_path="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.path' 2>/dev/null || true)"
            if [ "$run_path" = ".github/workflows/diagnose.yml" ]; then
              found="$run_id"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run-id=${found}" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR-local Gradle warm state::Restoring the newest diagnose artifact for PR #${PR_NUMBER}."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR-local Gradle warm state::No previous diagnose artifact exists for PR #${PR_NUMBER}; this run starts with only the trusted read-only Gradle cache."
          fi

      - &gradle-warm-download
        name: Download previous PR-local Gradle warm state
        if: steps.gradle-warm.outputs.found == 'true'
        # actions/download-artifact v7.0.0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ steps.gradle-warm.outputs.artifact-name }}
          path: ${{ runner.temp }}/appt-gradle-warm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gradle-warm.outputs.run-id }}

      - name: Check out the exact expected SHA
        if: inputs.expected_sha != ''
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The commit the assertion just proved, not the raw dispatch input. An
          # input is attacker-reachable; this is a value trusted logic has
          # verified. Everything from here on is the code under verification,
          # executed by this trusted workflow under its own read-only
          # permissions -- the same trust level as an ordinary pull-request run.
          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - &gradle-warm-restore
        name: Restore PR-local Gradle build cache
        if: steps.gradle-warm.outputs.found == 'true'
        env:
          ARCHIVE: ${{ runner.temp }}/appt-gradle-warm/gradle-local-build-cache.tar
        run: |
          set -euo pipefail

          if [ ! -f "$ARCHIVE" ]; then
            echo "::warning title=PR-local Gradle warm state::The selected artifact did not contain the expected archive; continuing without PR-local warm state."
            exit 0
          fi

          archive_bytes="$(stat -c '%s' "$ARCHIVE")"
          if [ "$archive_bytes" -gt 536870912 ]; then
            echo "::warning title=PR-local Gradle warm state::The restored archive exceeds the 512 MiB safety bound; ignoring it."
            exit 0
          fi

          python3 - "$ARCHIVE" "$HOME/.gradle/caches" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          try:
              with tarfile.open(archive, "r:") as bundle:
                  members = bundle.getmembers()
                  for member in members:
                      path = PurePosixPath(member.name)
                      allowed = (
                          not path.is_absolute()
                          and ".." not in path.parts
                          and len(path.parts) > 0
                          and path.parts[0] == "build-cache-1"
                          and (member.isfile() or member.isdir())
                      )
                      if not allowed:
                          print(
                              f"::warning title=PR-local Gradle warm state::"
                              f"Rejected unsafe archive entry {member.name!r}; continuing cold."
                          )
                          raise SystemExit(0)
                  destination.mkdir(parents=True, exist_ok=True)
                  bundle.extractall(destination, members=members, filter="data")
          except (tarfile.TarError, OSError) as error:
              print(
                  f"::warning title=PR-local Gradle warm state::"
                  f"Could not restore the artifact ({error}); continuing cold."
              )
              raise SystemExit(0)

          print("PR-local Gradle build cache restored.")
          PY


      - name: Run :app unit and Robolectric tests
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/app-unit.log || {
              echo "::error title=app-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/app-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/app-unit.log || true
              exit 1
          }

      - &gradle-warm-package
        name: Package PR-local Gradle warm state
        id: gradle-warm-pack
        if: always() && steps.assert-target.outputs.pr-number != ''
        run: |
          set -euo pipefail

          cache_dir="$HOME/.gradle/caches/build-cache-1"
          archive="${RUNNER_TEMP}/gradle-local-build-cache.tar"
          rm -f "$archive"

          if [ ! -d "$cache_dir" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR-local Gradle warm state::No local Gradle build cache was produced."
            exit 0
          fi

          cache_kib="$(du -sk "$cache_dir" | awk '{print $1}')"
          if [ "$cache_kib" -gt 524288 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PR-local Gradle warm state::Local Gradle build cache exceeds 512 MiB; skipping warm-state upload."
            exit 0
          fi

          /usr/bin/tar -cf "$archive" -C "$HOME/.gradle/caches" build-cache-1
          archive_bytes="$(stat -c '%s' "$archive")"
          if [ "$archive_bytes" -gt 536870912 ]; then
            rm -f "$archive"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PR-local Gradle warm state::Packaged Gradle build cache exceeds 512 MiB; skipping upload."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=PR-local Gradle warm state::Prepared a bounded build-cache artifact for the next diagnostic run."

      - &gradle-warm-upload
        name: Upload PR-local Gradle warm state
        if: always() && steps.gradle-warm-pack.outputs.available == 'true'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appt-gradle-local-cache-pr-${{ steps.assert-target.outputs.pr-number }}
          path: ${{ runner.temp }}/gradle-local-build-cache.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload app unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-app-unit-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # samsung-unit — :samsung unit tests only.
  # ---------------------------------------------------------------------------
  samsung-unit:
    name: samsung-unit
    if: inputs.mode == 'samsung-unit'
    runs-on: ubuntu-24.04
