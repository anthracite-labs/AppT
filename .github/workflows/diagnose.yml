          ref: ${{ steps.assert-target.outputs.sha }}
          persist-credentials: false

      - *gradle-warm-restore

      - name: Run :samsung unit tests
        run: |
          set -o pipefail
          mapfile -t DIAGNOSE_ARGS < "${RUNNER_TEMP}/diagnose-args"
          "${DIAGNOSE_ARGS[@]}" 2>&1 | tee /tmp/samsung-unit.log || {
              echo "::error title=samsung-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/samsung-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/samsung-unit.log || true
              exit 1
          }

      - *gradle-warm-package

      - *gradle-warm-upload

      - name: Upload Samsung unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-samsung-unit-reports
          path: |
            samsung/build/reports/tests/test/**
            samsung/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

