# AppT focused diagnostics — permanent, manual, and never terminal.
#
# Topology (Issue #88)
# -------------------
# This workflow replaces the retired `samsung-targeted` dispatch mode of
# `verify.yml`. It is the permanent home of focused implementation feedback:
# one mode per meaningful failure domain, invokable on demand by a human or by
# the trusted agent-control bridge, with no temporary per-issue workflow YAML.
#
# Non-terminal by construction:
#   * every mode is `workflow_dispatch` only, so a diagnostic run is never
#     produced by a pull-request or push event;
#   * no job here is named `gate`, so a diagnostic run cannot produce the
#     `verify / gate` status that default-branch protection requires;
#   * the run summary states plainly that the result is implementation
#     feedback and does not satisfy terminal repository verification.
#
# A finished candidate is verified by `verify` (full run), never by this file.

name: diagnose

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Focused diagnostic mode. Every mode is implementation feedback only
          and does not satisfy verify / gate.
        required: true
        default: 'app-unit'
        type: choice
        options:
          - app-unit
          - samsung-unit
          - android-static
          - android-build
          - backend-static
          - backend-test
          - backend
          - device
      expected_sha:
        description: >-
          Commit SHA the dispatched ref was expected to resolve to. Set by the
          agent-control bridge; every mode job hard-fails before doing any work
          if the ref no longer resolves to it. Leave empty for an ordinary
          manual dispatch.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # app-unit — :app JVM/Robolectric tests only.
  # ---------------------------------------------------------------------------
  app-unit:
    name: app-unit
    if: inputs.mode == 'app-unit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run :app unit and Robolectric tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --continue \
            :app:testDebugUnitTest 2>&1 | tee /tmp/app-unit.log || {
              echo "::error title=app-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/app-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/app-unit.log || true
              exit 1
            }

      - name: Upload app unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-app-unit-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # samsung-unit — :samsung unit tests only.
  # ---------------------------------------------------------------------------
  samsung-unit:
    name: samsung-unit
    if: inputs.mode == 'samsung-unit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run :samsung unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --continue \
            :samsung:test 2>&1 | tee /tmp/samsung-unit.log || {
              echo "::error title=samsung-unit Failure::$(grep -A 10 "\* What went wrong:" /tmp/samsung-unit.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/samsung-unit.log || true
              exit 1
            }

      - name: Upload Samsung unit-test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-samsung-unit-reports
          path: |
            samsung/build/reports/tests/test/**
            samsung/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # android-static — Android Lint, detekt, appTGuards and dependency locks.
  # ---------------------------------------------------------------------------
  android-static:
    name: android-static
    if: inputs.mode == 'android-static'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Android static and policy verification
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --continue \
            androidStatic 2>&1 | tee /tmp/android-static.log || {
              echo "::error title=android-static Failure::$(grep -A 10 "\* What went wrong:" /tmp/android-static.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/android-static.log || true
              exit 1
            }

      - name: Upload Lint and detekt reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-android-static-reports
          path: |
            app/build/reports/lint-results*
            samsung/build/reports/lint-results*
            app/build/reports/detekt/**
            samsung/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # android-build — debug assembly and macrobenchmark compilation.
  # ---------------------------------------------------------------------------
  android-build:
    name: android-build
    if: inputs.mode == 'android-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Android build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict --continue \
            androidBuild 2>&1 | tee /tmp/android-build.log || {
              echo "::error title=android-build Failure::$(grep -A 10 "\* What went wrong:" /tmp/android-build.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/android-build.log || true
              exit 1
            }

  # ---------------------------------------------------------------------------
  # backend-static — TypeScript typecheck, ESLint, Prettier, Knip.
  # ---------------------------------------------------------------------------
  backend-static:
    name: backend-static
    if: inputs.mode == 'backend-static'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install from committed lockfile
        run: npm ci --prefix backend

      - name: Run backend static verification interface
        run: npm run verify:static --prefix backend

  # ---------------------------------------------------------------------------
  # backend-test — Jest with LCOV coverage.
  # ---------------------------------------------------------------------------
  backend-test:
    name: backend-test
    if: inputs.mode == 'backend-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install from committed lockfile
        run: npm ci --prefix backend

      - name: Run backend tests with LCOV coverage
        run: npm run verify:test --prefix backend

      - name: Upload backend coverage
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-backend-coverage
          path: backend/coverage/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # backend — the whole backend verification interface (static plus tests).
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    if: inputs.mode == 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install from committed lockfile
        run: npm ci --prefix backend

      - name: Run backend verification interface
        run: npm run verify --prefix backend

      - name: Upload backend coverage
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-backend-coverage
          path: backend/coverage/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # device — installed-app acceptance on a Gradle Managed Device (API 29).
  # ---------------------------------------------------------------------------
  device:
    name: device
    if: inputs.mode == 'device'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert the dispatch target
        uses: ./.github/actions/assert-dispatch-target # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          expected-sha: ${{ inputs.expected_sha }}

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Run Gradle Managed Device Acceptance Test (API 29)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            :app:pixel2api29DebugAndroidTest 2>&1 | tee /tmp/gmd.log || {
              echo "::error title=device Failure::$(grep -A 10 "\* What went wrong:" /tmp/gmd.log | head -n 10 | tr '\n' ' ')"
              grep -A 30 "FAILURE: Build failed" /tmp/gmd.log || true
              {
                echo "### GMD Failure Log"
                echo '```'
                tail -n 60 /tmp/gmd.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Upload managed device reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnose-managed-device-report
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Non-terminal record. This job exists so every diagnostic run states, on the
  # run itself, what it is and what it is not.
  # ---------------------------------------------------------------------------
  feedback-report:
    name: Diagnostic report (not terminal verification)
    needs:
      - app-unit
      - samsung-unit
      - android-static
      - android-build
      - backend-static
      - backend-test
      - backend
      - device
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record that this run is not terminal verification
        env:
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          {
            echo "### diagnose: ${MODE}"
            echo
            echo "- commit: \`${SHA}\` (\`${REF}\`)"
            echo "- run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
            echo
            echo "This dispatch is **implementation feedback only**. It is **not** terminal"
            echo "repository verification and it does **not** satisfy \`verify / gate\`."
            echo "Terminal verification of a finished candidate is a full run of"
            echo "\`verify\` (workflow \`verify\`, job \`gate\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "diagnose/${MODE}: implementation feedback only; not terminal verification."
