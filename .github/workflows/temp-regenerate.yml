name: Temp Regenerate Supply Chain

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate Gradle Locks and Verification Metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      - name: Format with Spotless and regenerate verification metadata
        run: |
          ./gradlew --no-daemon spotlessApply > /tmp/spotless.log 2>&1 || true
          tail -n 40 /tmp/spotless.log
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug testDebugUnitTest lintDebug :macrobenchmark:assembleBenchmark appTGuards \
            spotlessCheck koverXmlReport > /tmp/verify-meta.log 2>&1 || true
          tail -n 40 /tmp/verify-meta.log

      - name: Regenerate lockfiles
        run: |
          ./gradlew resolveAndLockAll --write-locks > /tmp/locks.log 2>&1 || true
          tail -n 40 /tmp/locks.log

      - name: Commit and push changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -A
          echo "=== SPOTLESS LOG ===" > build-summary.txt
          cat /tmp/spotless.log >> build-summary.txt 2>/dev/null || true
          echo "=== VERIFY METADATA LOG ===" >> build-summary.txt
          tail -n 80 /tmp/verify-meta.log >> build-summary.txt 2>/dev/null || true
          echo "=== LOCKS LOG ===" >> build-summary.txt
          tail -n 80 /tmp/locks.log >> build-summary.txt 2>/dev/null || true
          git add build-summary.txt
          git commit -m "ci(supply-chain): apply spotless formatting, verification metadata and lockfiles" || echo "No changes"
          git push origin HEAD:arena/01a0d233-appt || echo "Push failed"
