name: Temp Regenerate Supply Chain

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate Gradle Locks and Verification Metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      - name: Format with Spotless
        run: |
          ./gradlew --no-daemon spotlessApply || true

      - name: Regenerate verification metadata and lockfiles
        run: |
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug testDebugUnitTest lintDebug :macrobenchmark:assembleBenchmark appTGuards \
            spotlessCheck koverXmlReportDebug koverVerifyDebug
          ./gradlew resolveAndLockAll --write-locks

      - name: Verify with strict dependency verification
        run: |
          ./gradlew --no-daemon --dependency-verification=strict ciCheck

      - name: Upload regenerated supply-chain artifacts
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-supply-chain
          path: |
            gradle/verification-metadata.xml
            **/*.lockfile
            app/src/**
            macrobenchmark/src/**
            build.gradle.kts
            app/build.gradle.kts
            samsung/build.gradle.kts
            macrobenchmark/build.gradle.kts
