name: Temp Regenerate Supply Chain

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate Gradle Locks and Verification Metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.1'
          cache-provider: 'basic'

      - name: Format with Spotless
        run: |
          ./gradlew --no-daemon spotlessApply || true

      - name: Regenerate verification metadata and lockfiles
        run: |
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug testDebugUnitTest lintDebug :macrobenchmark:assembleBenchmark appTGuards \
            spotlessCheck koverXmlReportDebug 2>&1 | tee /tmp/gradle-verify.log || true

          ./gradlew resolveAndLockAll --write-locks 2>&1 | tee /tmp/gradle-locks.log || true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git add **/*.lockfile
          git add app/src/
          git add macrobenchmark/src/
          if [ -f /tmp/gradle-verify.log ]; then
            tail -n 80 /tmp/gradle-verify.log > build-summary.txt
            git add build-summary.txt
          fi
          git commit -m "ci(supply-chain): commit regenerated verification metadata, lockfiles and spotless format" || echo "No changes to commit"
          git push origin HEAD:arena/01a0d233-appt || echo "Push failed"
