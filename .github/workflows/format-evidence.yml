# TEMPORARY branch-scoped evidence workflow (Issue #91 S04 correction pass).
#
# Route justification: spotlessKotlinCheck cannot run in the implementation
# sandbox (no JDK; package hosts blocked) and no diagnose.yml mode owns the
# formatting surface, so the full violation list is otherwise unreachable.
# Read-only: it runs the check and reports; it never mutates sources.
# REMOVE BEFORE TERMINAL VERIFICATION.

name: format-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up the JVM
        uses: ./.github/actions/setup-jvm
        with:
          java-version: '17'
      - name: Run spotlessKotlinCheck and surface the full violation list
        run: |
          set -o pipefail
          ./gradlew --no-daemon spotlessKotlinCheck 2>&1 | tee /tmp/spotless.log || {
            echo "### spotlessKotlinCheck violations (full list)" >> "$GITHUB_STEP_SUMMARY"
            awk '/had format violations/,/^\* Try/' /tmp/spotless.log >> "$GITHUB_STEP_SUMMARY" || true
            # Chunked into ::error annotations so the evidence survives step-summary limits.
            awk '/had format violations/,/^\* Try/' /tmp/spotless.log | fold -w 480 | nl -ba | while read -r n chunk; do
              printf '::error title=spotless-%s::%s\n' "$n" "${chunk//$'\n'/ }"
            done
            exit 1
          }
