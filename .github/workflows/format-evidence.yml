# TEMPORARY format evidence — REMOVE BEFORE TERMINAL VERIFICATION.
#
# One push-triggered run that applies the repository formatter and surfaces the
# complete resulting diff as check-run annotations (one per file), so every
# remaining format violation is visible in a single run instead of one hunk per
# run. This is the narrow diagnostic route for a formatting-only terminal
# failure. Branch-scoped, read-only source (the apply happens in the runner's
# checkout, never pushed back), never a gate; deleted before the candidate is
# finished.

name: format-evidence

on:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  format-evidence:
    name: format-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: '17'

      - name: Apply the formatter
        run: |
          set +e
          ./gradlew spotlessApply > /tmp/apply.log 2>&1
          echo "spotlessApply exit status: $?"
          if git diff --quiet; then
            echo "::notice title=format-evidence::no format violations remain"
          else
            echo "::error title=format-evidence::spotlessApply changed $(git diff --stat | tail -1)"
            git diff --unified=2 > /tmp/format.diff
          fi
          exit 0

      - name: Surface the complete diff per file
        if: always()
        shell: python
        run: |
          import os
          import re

          if not os.path.exists("/tmp/format.diff"):
              print("no format diff was produced")
              raise SystemExit(0)
          diff = open("/tmp/format.diff").read()
          print(
              "::error title=format-evidence files::{}".format(
                  " | ".join(re.findall(r"^diff --git a/(\S+) b/(\S+)$", diff, flags=re.M) and [a for a, b in re.findall(r"^diff --git a/(\S+) b/(\S+)$", diff, flags=re.M)])
              )
          )
          chunks = re.split(r"^(diff --git .*)$", diff, flags=re.M)
          for i in range(1, len(chunks), 2):
              header = chunks[i]
              body = chunks[i + 1] if i + 1 < len(chunks) else ""
              path = re.search(r" b/(.+)$", header.strip()).group(1)
              pieces = re.split(r"^(@@ .*)$", body, flags=re.M)
              groups = []
              cur = header.replace("\n", " ⏎ ")
              for j in range(1, len(pieces), 2):
                  hunk = (pieces[j] + pieces[j + 1]).replace("\n", " ⏎ ")
                  if len(cur) + len(hunk) > 3400:
                      groups.append(cur)
                      cur = ""
                  cur += hunk
              groups.append(cur)
              for part, piece in enumerate(groups):
                  suffix = " part{}".format(part + 1) if part else ""
                  print("::error title=format diff {}{}::{}".format(path, suffix, piece))
