# TEMPORARY format evidence — REMOVE BEFORE TERMINAL VERIFICATION.
#
# One push-triggered run that applies the repository formatter and surfaces the
# complete resulting diff as check-run annotations, so every remaining format
# violation is visible in a single run instead of one hunk per run. This is the
# narrow diagnostic route for a formatting-only terminal failure. Branch-scoped,
# read-only source (the apply happens in the runner's checkout, never pushed
# back), never a gate; deleted before the candidate is finished.

name: format-evidence

on:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  format-evidence:
    name: format-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: '17'

      - name: Apply the formatter and surface the complete diff
        run: |
          set +e
          ./gradlew spotlessApply > /tmp/apply.log 2>&1
          echo "spotlessApply exit status: $?"
          if git diff --quiet; then
            echo "::notice title=format-evidence::no format violations remain"
          else
            git diff --unified=1 > /tmp/format.diff
            echo "::error title=format-evidence::spotlessApply changed $(git diff --stat | tail -1)"
            while IFS= read -r line; do
              echo "::error title=format::$line"
            done < /tmp/format.diff
          fi
          exit 0
