# One-shot: refresh lockfiles and verification metadata after a reviewed
# dependency change.
#
# The runtime-acceptance work added androidx.test:core and androidx.test:runner
# to :app's androidTest configurations (exact pins, via the version catalog).
# Dependency locking and strict verification are working as intended when they
# reject that change until the committed artifacts are refreshed, so the
# refresh happens here, as a reviewable commit, rather than by weakening either
# gate.
#
# The checksums cannot be produced in the authoring sandbox, which has no Maven
# egress. DELETE this workflow once it has run: ci.yml stays the gate and never
# regenerates supply-chain artifacts.

name: Dependency lock refresh

on:
  push:
    branches: [arena/01a0cc2b-appt]

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh lockfiles and verification metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      # Self-disabling: only acts while the new dependencies are absent from
      # the committed lock state.
      - name: Decide whether a refresh is needed
        id: need
        run: |
          set -euo pipefail
          needed=false
          grep -q 'androidx.test:core:1.6.1' app/gradle.lockfile || needed=true
          grep -q 'androidx.test:core' gradle/verification-metadata.xml \
            || needed=true
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "refresh needed: $needed"

      - name: Set up JDK
        if: steps.need.outputs.needed == 'true'
        # actions/setup-java v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Refresh the lockfiles
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --write-locks resolveAndLockAll

      - name: Refresh the verification metadata
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          before="$(grep -c '<component ' gradle/verification-metadata.xml)"
          # `help` covers configuration-time resolution (the buildscript
          # classpath); the task list covers execution-time graphs, including
          # the new androidTest compile/runtime classpaths.
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            help assembleDebug assembleDebugAndroidTest lintDebug \
            testDebugUnitTest dependencyLockCheck \
            :macrobenchmark:assembleBenchmark appTGuards
          after="$(grep -c '<component ' gradle/verification-metadata.xml)"
          echo "components: ${before} -> ${after}"

      # Proves the committed state verifies strictly, rather than merely that
      # the files changed.
      - name: Re-prove strict verification from the committed state
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --dependency-verification=strict \
            assembleDebug lintDebug testDebugUnitTest dependencyLockCheck
          ./gradlew --no-daemon --dependency-verification=strict appTGuards
          ./gradlew --no-daemon --dependency-verification=strict \
            :macrobenchmark:assembleBenchmark
          # The emulator job resolves this configuration, so prove it too.
          ./gradlew --no-daemon --dependency-verification=strict \
            :app:assembleDebugAndroidTest

      - name: Commit the refreshed artifacts
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gradle/verification-metadata.xml
          git add -f ./*/gradle.lockfile || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit \
            -m 'Refresh lockfiles and checksums for the androidTest dependencies' \
            -m 'androidx.test:core and androidx.test:runner were added to :app androidTest for the runtime-acceptance test. Locking and strict verification correctly rejected the change until the committed artifacts were refreshed; this is that refresh, re-proved under strict verification.' \
            -m 'Refs #27'
          git push origin HEAD:${{ github.ref_name }}
