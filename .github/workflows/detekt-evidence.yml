# TEMPORARY detekt evidence — REMOVE BEFORE TERMINAL VERIFICATION.
#
# One push-triggered run that reproduces the :app:detekt failure and surfaces
# every individual finding line as a check-run annotation, because the diagnose
# surfacer only carries the Gradle "what went wrong" tail and the report
# artifacts are not readable from this workspace. Branch-scoped, read-only,
# never a gate; deleted before the candidate is finished.

name: detekt-evidence

on:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  detekt-evidence:
    name: detekt-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: '17'

      - name: Run :app:detekt and surface each finding
        run: |
          set -o pipefail
          ./gradlew :app:detekt --continue > /tmp/detekt.log 2>&1
          status=$?
          echo "detekt exit status: $status"
          # Every per-finding line the detekt Gradle plugin prints to the console.
          grep -E '\.kt:[0-9]+:[0-9]+' /tmp/detekt.log | head -40 > /tmp/findings.txt || true
          if [ -s /tmp/findings.txt ]; then
            while IFS= read -r line; do
              echo "::error title=detekt finding::$line"
            done < /tmp/findings.txt
          fi
          # The text report, if the plugin wrote one, carries the same findings.
          find app/build/reports/detekt -name '*.txt' -print -exec cat {} \; || true
          tail -n 30 /tmp/detekt.log
