# TEMPORARY, authorized by Issue #117 comments 5941941531, 5942027335, 5942134313, and 5942385537.
# Exact-branch push only; remove after reviewing and committing the bounded formatter/state artifacts.
# This workflow formats only the authorized four-file set and generates dependency state unavailable in Arena.
name: temporary-dependency-state
run-name: Temporary Spotless/dependency-state regeneration for ${{ github.sha }}

on:
  push:
    branches:
      - arena/01a0f304-appt

permissions:
  contents: read

concurrency:
  group: temporary-dependency-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate formatter and dependency state
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Assert the authorized branch-push event
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = 'push'
          test "$REF" = 'refs/heads/arena/01a0f304-appt'

      - name: Check out the exact triggering commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17 without Actions caching
        # actions/setup-java v6.0.1. The cache input is intentionally omitted.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Assert the authorized formatter target source state
        env:
          TARGET_SHA: 4566d2ed7097f4ecc059d590ac84243117806472
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git diff --quiet "$TARGET_SHA" HEAD -- \
            app/src/debug/java/dev/anthracite/appt/remote/DebugLatencyRun.kt \
            app/src/debug/java/dev/anthracite/appt/remote/DebugS05Verifier.kt \
            app/src/main/java/dev/anthracite/appt/navigation/AppTNavGraph.kt \
            app/src/test/java/dev/anthracite/appt/remote/DebugLatencyRunTest.kt

      - name: Run the repository Spotless formatter
        id: formatter_apply
        run: ./gradlew spotlessApply

      - name: Capture the bounded four-file Spotless patch
        id: formatter_capture
        if: always()
        env:
          FORMATTER_OUTCOME: ${{ steps.formatter_apply.outcome }}
          TARGET_SHA: 4566d2ed7097f4ecc059d590ac84243117806472
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/appt-spotless-four-file"
          mkdir -p "$output_dir/files"
          patch_file="$output_dir/spotless-four-file.patch"
          manifest_file="$output_dir/manifest.txt"
          : > "$patch_file"

          target_files=(
            app/src/debug/java/dev/anthracite/appt/remote/DebugLatencyRun.kt
            app/src/debug/java/dev/anthracite/appt/remote/DebugS05Verifier.kt
            app/src/main/java/dev/anthracite/appt/navigation/AppTNavGraph.kt
            app/src/test/java/dev/anthracite/appt/remote/DebugLatencyRunTest.kt
          )

          if [ "$FORMATTER_OUTCOME" != 'success' ]; then
            {
              printf 'target_sha=%s\n' "$TARGET_SHA"
              printf 'formatter_outcome=%s\n' "$FORMATTER_OUTCOME"
              printf 'capture_outcome=not-run-formatter-failed\n'
            } | tee "$manifest_file"
            exit 0
          fi

          mapfile -t changed_paths < <(git diff --name-only --diff-filter=AMRT | LC_ALL=C sort -u)
          expected_paths="$(printf '%s\n' "${target_files[@]}" | LC_ALL=C sort)"
          actual_paths="$(printf '%s\n' "${changed_paths[@]}")"

          unexpected_paths=()
          for path in "${changed_paths[@]}"; do
            allowed=false
            for target_file in "${target_files[@]}"; do
              if [ "$path" = "$target_file" ]; then
                allowed=true
                break
              fi
            done
            if [ "$allowed" != 'true' ]; then
              unexpected_paths+=("$path")
            fi
          done

          if [ "${#unexpected_paths[@]}" -gt 0 ]; then
            {
              printf 'target_sha=%s\n' "$TARGET_SHA"
              printf 'formatter_outcome=%s\n' "$FORMATTER_OUTCOME"
              printf 'capture_outcome=failed-unexpected-tracked-files\n'
              printf 'unexpected_paths=%s\n' "${#unexpected_paths[@]}"
              printf '%s\n' "${unexpected_paths[@]}"
            } | tee "$manifest_file"
            echo '::error::spotlessApply modified tracked files outside the four-file allowlist.'
            exit 1
          fi

          if [ "$actual_paths" != "$expected_paths" ]; then
            {
              printf 'target_sha=%s\n' "$TARGET_SHA"
              printf 'formatter_outcome=%s\n' "$FORMATTER_OUTCOME"
              printf 'capture_outcome=failed-allowlist-mismatch\n'
              printf 'expected_paths:\n%s\n' "$expected_paths"
              printf 'actual_paths:\n%s\n' "$actual_paths"
            } | tee "$manifest_file"
            echo '::error::spotlessApply did not produce exactly the four authorized file changes.'
            exit 1
          fi

          git diff --check -- "${target_files[@]}"
          git diff --binary -- "${target_files[@]}" > "$patch_file"
          for path in "${target_files[@]}"; do
            mkdir -p "$output_dir/files/$(dirname "$path")"
            cp -- "$path" "$output_dir/files/$path"
          done

          patch_bytes="$(wc -c < "$patch_file" | tr -d '[:space:]')"
          patch_sha256="$(sha256sum "$patch_file" | cut -d ' ' -f 1)"
          total_bytes="$(find "$output_dir" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$patch_bytes" -gt 1048576 ] || [ "$total_bytes" -gt 8388608 ]; then
            echo "::error::Spotless output exceeded its 1 MiB patch / 8 MiB artifact bound."
            exit 1
          fi

          {
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'formatter_outcome=%s\n' "$FORMATTER_OUTCOME"
            printf 'capture_outcome=success\n'
            printf 'patch_sha256=%s\n' "$patch_sha256"
            printf 'patch_bytes=%s\n' "$patch_bytes"
            printf 'formatted_files=%s\n' "${#target_files[@]}"
            for path in "${target_files[@]}"; do
              file_bytes="$(wc -c < "$path" | tr -d '[:space:]')"
              file_sha256="$(sha256sum "$path" | cut -d ' ' -f 1)"
              printf 'file=%s bytes=%s sha256=%s\n' "$path" "$file_bytes" "$file_sha256"
            done
          } | tee "$manifest_file"

      - name: Emit bounded Spotless patch log fallback
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.formatter_capture.outcome }}
          TARGET_SHA: 4566d2ed7097f4ecc059d590ac84243117806472
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/appt-spotless-four-file/spotless-four-file.patch"
          if [ "$CAPTURE_OUTCOME" != 'success' ] || [ ! -s "$patch_file" ]; then
            echo 'Spotless patch fallback unavailable because capture did not produce a verified patch.'
            exit 0
          fi

          patch_bytes="$(wc -c < "$patch_file" | tr -d '[:space:]')"
          patch_sha256="$(sha256sum "$patch_file" | cut -d ' ' -f 1)"
          payload="$(gzip -9 -n -c "$patch_file" | base64 -w 0)"
          payload_chars="${#payload}"
          if [ "$patch_bytes" -gt 1048576 ] || [ "$payload_chars" -gt 262144 ]; then
            echo '::error::Spotless patch exceeds its bounded log-fallback limits.'
            exit 1
          fi

          printf '%s\n' '=== APPT_SPOTLESS_FOUR_FILE_PATCH_GZIP_BASE64_BEGIN ==='
          printf 'target_sha=%s\n' "$TARGET_SHA"
          printf 'patch_sha256=%s\n' "$patch_sha256"
          printf 'patch_bytes=%s\n' "$patch_bytes"
          printf '%s\n' "$payload" | fold -w 76
          printf '%s\n' '=== APPT_SPOTLESS_FOUR_FILE_PATCH_GZIP_BASE64_END ==='

      - name: Verify the formatted source tree
        id: spotless_check
        if: steps.formatter_apply.outcome == 'success' && steps.formatter_capture.outcome == 'success'
        run: ./gradlew spotlessCheck

      - name: Remove only the app lockfile in the ephemeral workspace
        if: steps.spotless_check.outcome == 'success'
        run: |
          set -euo pipefail
          test -f app/gradle.lockfile
          rm -- app/gradle.lockfile
          test ! -e app/gradle.lockfile

      - name: Regenerate Gradle dependency locks
        id: locks
        if: steps.spotless_check.outcome == 'success'
        run: ./gradlew resolveAndLockAll --write-locks

      - name: Emit bounded app lockfile log fallback
        if: always()
        env:
          LOCKS_OUTCOME: ${{ steps.locks.outcome }}
        run: |
          set -euo pipefail
          lock_file=app/gradle.lockfile
          if [ "$LOCKS_OUTCOME" != 'success' ] || [ ! -f "$lock_file" ]; then
            echo 'App lockfile fallback unavailable because lock regeneration did not complete.'
            exit 0
          fi

          byte_count="$(wc -c < "$lock_file" | tr -d '[:space:]')"
          if [ "$byte_count" -gt 2097152 ]; then
            echo "::error::App lockfile exceeds the 2 MiB fallback bound (${byte_count} bytes)."
            exit 1
          fi

          sha256="$(sha256sum "$lock_file" | cut -d ' ' -f 1)"
          payload="$(gzip -9 -n -c "$lock_file" | base64 -w 0)"
          payload_chars="${#payload}"
          if [ "$payload_chars" -gt 65536 ]; then
            echo "::error::Compressed app lockfile exceeds the 64 KiB encoded fallback bound (${payload_chars} characters)."
            exit 1
          fi

          printf '%s\n' '=== APPT_APP_GRADLE_LOCKFILE_GZIP_BASE64_BEGIN ==='
          printf 'sha256=%s\n' "$sha256"
          printf 'bytes=%s\n' "$byte_count"
          printf '%s\n' "$payload" | fold -w 76
          printf '%s\n' '=== APPT_APP_GRADLE_LOCKFILE_GZIP_BASE64_END ==='

      - name: Regenerate strict verification metadata
        id: metadata
        if: steps.locks.outcome == 'success'
        continue-on-error: true
        run: ./gradlew --no-daemon --write-verification-metadata sha256 ciCheck

      - name: Collect only generated dependency-state candidates
        if: always()
        env:
          LOCKS_OUTCOME: ${{ steps.locks.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/appt-dependency-state"
          mkdir -p "$artifact_dir"

          mapfile -t candidates < <(
            {
              git diff --name-only --diff-filter=AMRT
              git ls-files --others --exclude-standard
            } | sort -u | while IFS= read -r path; do
              case "$path" in
                app/gradle.lockfile|gradle/verification-metadata.xml)
                  if [ -f "$path" ]; then
                    printf '%s\n' "$path"
                  fi
                  ;;
              esac
            done
          )

          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'locks_outcome=%s\n' "${LOCKS_OUTCOME:-not-run}"
            printf 'metadata_outcome=%s\n' "${METADATA_OUTCOME:-not-run}"
            printf 'generated_paths=%s\n' "${#candidates[@]}"
            for path in "${candidates[@]}"; do
              printf '%s\n' "$path"
              mkdir -p "$artifact_dir/$(dirname "$path")"
              cp -- "$path" "$artifact_dir/$path"
            done
          } | tee "$artifact_dir/manifest.txt"

          if [ "${#candidates[@]}" -gt 0 ]; then
            git diff --check -- "${candidates[@]}"
            git diff --binary -- "${candidates[@]}" > "$artifact_dir/dependency-state.patch"
          else
            printf '# No generated dependency-state diff was produced.\n' > "$artifact_dir/dependency-state.patch"
          fi

          size_bytes="$(find "$artifact_dir" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$size_bytes" -gt 10485760 ]; then
            echo "::error::Dependency-state artifact exceeds the 10 MiB bound (${size_bytes} bytes)."
            exit 1
          fi
          echo "Collected ${#candidates[@]} generated dependency-state path(s), ${size_bytes} bytes total."

      - name: Upload bounded generated dependency state
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appt-dependency-state-${{ github.sha }}
          path: ${{ runner.temp }}/appt-dependency-state/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload bounded four-file Spotless output
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appt-spotless-four-file-${{ github.sha }}
          path: ${{ runner.temp }}/appt-spotless-four-file/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Preserve formatter and generation command failures
        if: always()
        env:
          FORMATTER_OUTCOME: ${{ steps.formatter_apply.outcome }}
          CAPTURE_OUTCOME: ${{ steps.formatter_capture.outcome }}
          SPOTLESS_OUTCOME: ${{ steps.spotless_check.outcome }}
          LOCKS_OUTCOME: ${{ steps.locks.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        run: |
          set -euo pipefail
          for pair in \
            "formatterApply:${FORMATTER_OUTCOME:-not-run}" \
            "formatterCapture:${CAPTURE_OUTCOME:-not-run}" \
            "spotlessCheck:${SPOTLESS_OUTCOME:-not-run}" \
            "lockRegeneration:${LOCKS_OUTCOME:-not-run}" \
            "verificationMetadata:${METADATA_OUTCOME:-not-run}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" != 'success' ]; then
              echo "${name} outcome was: ${outcome}"
              exit 1
            fi
          done
