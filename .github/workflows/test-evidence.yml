# TEMPORARY test evidence — REMOVE BEFORE TERMINAL VERIFICATION.
#
# One push-triggered run that reproduces the :samsung unit-test failure and
# surfaces each failing test's name, message and stack head as check-run
# annotations, because the diagnose surfacer only carries the Gradle "what went
# wrong" tail and the report artifacts are not readable from this workspace.
# Branch-scoped, read-only, never a gate; deleted before the candidate is
# finished.

name: test-evidence

on:
  push:
    branches:
      - arena/01a0e942-appt

permissions:
  contents: read

jobs:
  test-evidence:
    name: test-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up the Android/JVM toolchain
        uses: ./.github/actions/setup-jvm # zizmor: ignore[self-repository] pinned actionlint 1.7.7 cannot parse GitHub's $/ self-repository form yet
        with:
          java-version: '17'

      - name: Run :samsung tests
        run: |
          set +e
          ./gradlew :samsung:testDebugUnitTest > /tmp/test.log 2>&1
          echo "gradle exit status: $?"
          exit 0

      - name: Surface every failing test
        if: always()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("samsung/build/test-results/testDebugUnitTest/*.xml")
          if not paths:
              print("::error title=test-evidence::no test result XML was produced")
          for path in paths:
              tree = ET.parse(path)
              for suite in tree.iter("testsuite"):
                  for case in suite.iter("testcase"):
                      failures = list(case.iter("failure")) + list(case.iter("error"))
                      for failure in failures:
                          name = "{} > {}".format(suite.get("name"), case.get("name"))
                          message = (failure.get("message") or "").replace("\n", " ")[:300]
                          print("::error title=test failure::{} :: {}".format(name, message))
                          text = (failure.text or "").strip().splitlines()[:6]
                          for line in text:
                              print("::error title=stack::  {}".format(line.strip()[:220]))
