# TEMPORARY — supply-chain regeneration bootstrap. DELETE BEFORE MERGE.
#
# Why this exists at all, given ci.yml's comment that "there is no bootstrap or
# self-healing path here on purpose":
#
#   Adding the detekt Gradle plugin (Issue #36) puts new artifacts on the
#   buildscript classpath and adds a new lockable `detekt` configuration. The
#   repository resolves under dependencyLocking { lockAllConfigurations() } and
#   CI runs --dependency-verification=strict, so gradle/verification-metadata.xml
#   and every *.gradle.lockfile must be regenerated BEFORE the plugin can build.
#   Their contents are SHA-256 checksums of a resolved graph, which can only be
#   produced by resolving it — and the development sandbox for this change has no
#   JVM and no reachable Maven repository.
#
#   So the regeneration is performed here, once, on a GitHub-hosted runner, and
#   the results are committed as a reviewed diff. That is the same accepted
#   process as any other dependency change (docs/BUILD.md); only the machine
#   differs.
#
# What this file is NOT:
#   * Not part of the CI floor. Its only triggers are workflow_dispatch and a
#     push scoped to the single PR branch this change is developed on, so it can
#     never run for any other branch, any pull request, or main. It is not a
#     self-healing path: nothing in CI calls it, and a failed regeneration leaves
#     the committed artifacts untouched.
#
#     The push trigger exists because GitHub will not register a workflow_dispatch
#     workflow for dispatch unless the file is on the default branch, and putting
#     a one-off bootstrap on main is exactly what must not happen.
#
#   * Not a weakening of strict verification. The one resolution pass that WRITES
#     checksums runs lenient, because the checksums being written are precisely
#     the ones strict mode would demand. Every later step in this file runs
#     --dependency-verification=strict, and the artifacts are only committed if
#     that gate passes.
#
#   * Not able to touch anything but two kinds of file. The commit step adds
#     exactly gradle/verification-metadata.xml and the four committed lockfiles.
#
# On permissions: this job needs contents: write, which is more than the
# contents: read the rest of CI uses. The reason is environmental — the sandbox
# driving this change cannot read runner logs or download artifacts (both are
# served from blob storage that is not reachable from it), so the regenerated
# files have no other way back. The write is confined to this temporary job, is
# limited to the paths listed in the commit step, and the file is deleted before
# merge. No repository secret is used; the push uses the automatic GITHUB_TOKEN.

name: TEMP regen supply-chain (delete before merge)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this regeneration is being run (recorded in the log)'
        required: false
        default: 'Add detekt: new buildscript artifacts + new lockable detekt configuration'
  # Scoped to this branch alone. See the trigger note above.
  push:
    branches:
      - arena/01a0ce78-appt
    paths:
      - .github/workflows/zz-temp-regen.yml
      - gradle/libs.versions.toml
      - build.gradle.kts
      - app/build.gradle.kts
      - samsung/build.gradle.kts
      - config/detekt/detekt.yml

permissions:
  contents: read

concurrency:
  group: tmp-regen-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  regenerate:
    name: Regenerate lockfiles and verification metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # See the note at the top of this file. Scoped to this job only.
      contents: write
    steps:
      - name: Check out
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Record the reason
        run: |
          echo "Regeneration reason: ${{ inputs.reason }}"
          echo "Ref: ${{ github.ref }} @ ${{ github.sha }}"

      - name: Set up JDK
        # actions/setup-java v4.7.1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        # gradle/actions/setup-gradle v4.4.2
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # No cache: a stale restored build cache could let a resolution pass
          # skip work and leave an artifact unrecorded.
          cache-disabled: true

      # Step 1 — lockfiles. Verification is off for this pass only, because the
      # detekt artifacts being resolved are precisely the ones not yet in the
      # metadata file.
      - name: Refresh the committed lockfiles
        run: >-
          chmod +x ./gradlew
          && ./gradlew --no-daemon --dependency-verification=off
          resolveAndLockAll --write-locks

      # Step 2 — write the checksums over the task set CI exercises, so the
      # regenerated file still covers what the old one did.
      #
      # `--continue` and the tolerant exit handling are deliberate: this pass is
      # here to RESOLVE, and a detekt or lint finding must not prevent the
      # checksums being written. Any such finding is re-run under strict
      # conditions in a later step and reported as an annotation, which is the
      # only channel back from this runner that the driving sandbox can read.
      - name: Regenerate verification metadata (sha256)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue \
            --dependency-verification=lenient \
            --write-verification-metadata sha256 \
            assembleDebug lintDebug testDebugUnitTest \
            :macrobenchmark:assembleBenchmark detekt 2>&1 | tee /tmp/regen.log
          status=${PIPESTATUS[0]}
          echo "resolution pass exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "Surfacing the failing lines as annotations:"
            grep -E "FAILED$|^FAILURE|error:|\.kt:[0-9]+:[0-9]+:|What went wrong" /tmp/regen.log \
              | tail -30 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit 0

      # Step 3 — the gate. If the regenerated artifacts do not satisfy the real
      # CI conditions, this fails and nothing is committed.
      - name: Prove the regenerated state satisfies strict verification
        run: >-
          ./gradlew --no-daemon --dependency-verification=strict
          dependencyLockCheck appTGuards

      # Step 4 — the actual detekt result, reported where it can be read.
      - name: Run detekt under strict verification
        run: |
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification=strict detekt 2>&1 | tee /tmp/detekt.log
          status=${PIPESTATUS[0]}
          echo "detekt exit status: $status"
          grep -E "\.kt:[0-9]+:[0-9]+:" /tmp/detekt.log | head -60 \
            | while IFS= read -r l; do echo "::error title=detekt finding::${l}"; done
          if [ "$status" -ne 0 ]; then
            grep -E "Build failed with|weighted issues|FAILURE" /tmp/detekt.log | tail -5 \
              | while IFS= read -r l; do echo "::error title=detekt::${l}"; done
          fi
          exit "$status"

      - name: Show exactly what changed
        run: |
          echo "=== git diff --stat ==="
          git --no-pager diff --stat
          echo
          echo "=== non-detekt components added ==="
          git --no-pager diff -U0 gradle/verification-metadata.xml \
            | grep -E '^\+.*<component ' | grep -vi detekt | head -40 || true
          echo
          echo "=== detekt components added ==="
          git --no-pager diff -U0 gradle/verification-metadata.xml \
            | grep -E '^\+.*<component ' | grep -ci detekt || true
          echo
          echo "=== components REMOVED (must be none) ==="
          git --no-pager diff -U0 gradle/verification-metadata.xml \
            | grep -E '^-.*<component ' || echo "  none"

      - name: Commit the regenerated artifacts
        run: |
          set -euo pipefail
          git config user.name  "appt-supply-chain-regen[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Exactly these paths. Nothing from build/ is ever added.
          git add -- \
            gradle/verification-metadata.xml \
            app/gradle.lockfile \
            samsung/gradle.lockfile \
            macrobenchmark/gradle.lockfile \
            settings-gradle.lockfile
          if git diff --cached --quiet; then
            echo "Nothing to commit — the regenerated artifacts match what is committed."
            exit 0
          fi
          echo "=== staged ==="
          git --no-pager diff --cached --stat
          git commit -m "Regenerate lockfiles and verification metadata for detekt

          Produced by the temporary zz-temp-regen bootstrap on a GitHub-hosted
          runner, because these checksums can only be written by resolving the
          graph and the development sandbox for this change cannot resolve it.
          The state committed here passed
          ./gradlew --dependency-verification=strict dependencyLockCheck appTGuards
          on the runner before it was committed.

          Reason: ${{ inputs.reason }}"
          git push origin "HEAD:${{ github.ref_name }}"
