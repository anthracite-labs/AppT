# Dependabot version-update configuration for AppT.
#
# Purpose and limits (Issue #36): this produces *reviewed pull requests*. It does
# not replace, and must not be read as replacing, any of the existing controls:
#
#   * committed Gradle lockfiles, refreshed only through
#     `./gradlew resolveAndLockAll --write-locks` as a reviewed change;
#   * gradle/verification-metadata.xml under --dependency-verification=strict;
#   * the committed Gradle wrapper with its pinned distributionSha256Sum;
#   * backend/package-lock.json with `npm ci` as the only install;
#   * the dependency-review check on every pull request;
#   * the release.md rule that new significant dependencies carry a license and
#     provenance note, and that updates arrive as reviewed pull requests while
#     "silent upgrades are not allowed".
#
# Deliberately absent, per Issue #36 and release.md:
#   * no auto-merge anywhere. Nothing in this file enables it, and no
#     auto-merge workflow exists in .github/workflows/.
#   * no `registries:` block, so nothing but the default public registries the
#     build already uses can be suggested.
#   * no `insecure` or scheduled security-update-only noise beyond what GitHub
#     raises separately; this file is about *version* updates.
#
# Cadence is monthly with grouped minor/patch updates: a low-noise rhythm that
# keeps each pull request small enough to actually review, which is the point of
# a reviewed-update policy.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Gradle: gradle/libs.versions.toml, the module lockfiles, and the wrapper
  # properties. The version catalog is the single place a version is written, so
  # a bump is a one-line diff that `versionCatalogPinned` still enforces as exact.
  # ---------------------------------------------------------------------------
  - package-ecosystem: gradle
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: 'deps(gradle)'
    groups:
      # AndroidX and Compose move together; keeping them in one pull request
      # avoids a matrix of individually-broken intermediate states.
      androidx:
        patterns:
          - 'androidx.*'
          - 'com.android.*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
      # Everything else stays individual: a lone dependency bump is easier to
      # reason about and to revert than a mixed bag.

    # REVIEWER NOTE — required follow-up for every Gradle bump in this repo.
    #
    # Dependabot updates gradle/libs.versions.toml and the *.gradle.lockfile
    # files, but it CANNOT update gradle/verification-metadata.xml. Because CI
    # resolves under --dependency-verification=strict, a Dependabot Gradle pull
    # request will fail until the new artifacts' checksums are added. That is the
    # intended fail-closed behaviour, not a flake. Before merging, run the
    # documented regeneration (docs/BUILD.md, gradle/verification-metadata.template.xml):
    #
    #   ./gradlew --no-daemon --write-verification-metadata sha256 \
    #     assembleDebug testDebugUnitTest lintDebug :macrobenchmark:assembleBenchmark
    #   ./gradlew resolveAndLockAll --write-locks
    #
    # Then review the generated <components> diff exactly as you would review a
    # lockfile, and commit both artifacts to the Dependabot branch.

  # ---------------------------------------------------------------------------
  # Backend npm package. All dependency updates must go through this directory,
  # never a root-level npm ecosystem, because backend/ owns its own lockfile and
  # the Android tree must never gain a package.json.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: '/backend'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: 'deps(backend)'
    groups:
      # The TypeScript toolchain (compiler, ts-jest, types) must move as one set.
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'ts-jest'
          - '@types/*'
      linting:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'prettier'
      jest:
        patterns:
          - 'jest'
          - '@jest/*'

  # ---------------------------------------------------------------------------
  # GitHub Actions. Dependabot keeps the immutable commit-SHA pins current and
  # preserves the human-readable tag comment beside them, which is exactly the
  # release.md pinning contract: CI cannot be retargeted by a moving tag, and a
  # reviewer can still see which release a SHA corresponds to.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'deps(actions)'
