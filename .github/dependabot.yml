
version: 2

multi-ecosystem-groups:
  app-modernization:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - modernization
    commit-message:
      prefix: 'deps(modernization)'

updates:
  - package-ecosystem: gradle
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - gradle
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
    groups:
      androidx:
        patterns:
          - 'androidx.*'
          - 'com.android.*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'


  - package-ecosystem: npm
    directory: '/backend'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
      exclude:
        - 'typescript'
        - 'typescript-eslint'
        - '@typescript-eslint/*'
    labels:
      - dependencies
      - backend
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
    groups:
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'ts-jest'
          - '@types/*'
      linting:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'prettier'
      jest:
        patterns:
          - 'jest'
          - '@jest/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
