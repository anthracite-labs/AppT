# Dependabot version-update configuration for AppT.
#
# Purpose and limits (Issue #36, Issue #56): this produces *reviewed pull requests*.
# It does not replace, and must not be read as replacing, any of the existing controls:
#
#   * committed Gradle lockfiles, refreshed only through
#     `./gradlew resolveAndLockAll --write-locks` as a reviewed change;
#   * gradle/verification-metadata.xml under --dependency-verification=strict;
#   * the committed Gradle wrapper with its pinned distributionSha256Sum;
#   * backend/package-lock.json with `npm ci` as the only install;
#   * the dependency-review check on every pull request;
#   * the release.md rule that new significant dependencies carry a license and
#     provenance note, and that updates arrive as reviewed pull requests while
#     "silent upgrades are not allowed".
#
# Deliberately absent, per Issue #36 and release.md:
#   * no auto-merge anywhere. Nothing in this file enables it, and no
#     auto-merge workflow exists in .github/workflows/.
#   * no `registries:` block, so nothing but the default public registries the
#     build already uses can be suggested.
#   * no `insecure` or scheduled security-update-only noise beyond what GitHub
#     raises separately; this file is about *version* updates.
#
# Cadence is weekly with grouped minor/patch updates: a coordinated weekly
# modernization rhythm that keeps proposals aligned across Gradle, backend npm,
# and GitHub Actions, small enough to actually review.

version: 2

multi-ecosystem-groups:
  app-modernization:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - modernization
    commit-message:
      prefix: 'deps(modernization)'

updates:
  # ---------------------------------------------------------------------------
  # Gradle: gradle/libs.versions.toml is where Dependabot writes its bumps.
  # ---------------------------------------------------------------------------
  - package-ecosystem: gradle
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - gradle
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
    groups:
      androidx:
        patterns:
          - 'androidx.*'
          - 'com.android.*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'

    # REVIEWER NOTE — required follow-up for every Gradle bump in this repo.
    #
    # Dependabot proposes the version bump in gradle/libs.versions.toml. Do not
    # assume it keeps anything else in step automatically. It CANNOT write
    # gradle/verification-metadata.xml at all, and its Gradle lockfile support
    # has a documented limitation where gradle.lockfile is not updated when a
    # Gradle version catalog is in use (dependabot-core#12557; later work in
    # dependabot-core#14879 may have narrowed that gap — confirm on the first
    # Dependabot Gradle pull request rather than trusting it either way). AppT
    # is exactly that catalog-driven setup, so the manual regeneration below is
    # the authoritative process for BOTH the *.gradle.lockfile files and the
    # verification metadata.
    #
    # Because CI resolves under --dependency-verification=strict and runs
    # dependencyLockCheck, a Dependabot Gradle pull request fails closed until
    # the regenerated artifacts are committed. That is the intended fail-closed
    # behaviour, not a flake. Before merging, run the documented regeneration
    # (docs/BUILD.md, gradle/verification-metadata.template.xml):
    #
    #   ./gradlew --no-daemon --write-verification-metadata sha256 \
    #     ciCheck
    #   ./gradlew resolveAndLockAll --write-locks
    #
    # Then review the generated <components> diff exactly as you would review a
    # lockfile, and commit the regenerated artifacts to the Dependabot branch.

  # ---------------------------------------------------------------------------
  # Backend npm package. All dependency updates must go through this directory,
  # never a root-level npm ecosystem, because backend/ owns its own lockfile and
  # the Android tree must never gain a package.json.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: '/backend'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - backend
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
    groups:
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'ts-jest'
          - '@types/*'
      linting:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'prettier'
      jest:
        patterns:
          - 'jest'
          - '@jest/*'

  # ---------------------------------------------------------------------------
  # GitHub Actions. Dependabot keeps the immutable commit-SHA pins current and
  # preserves the human-readable tag comment beside them, which is exactly the
  # release.md pinning contract: CI cannot be retargeted by a moving tag, and a
  # reviewer can still see which release a SHA corresponds to.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    patterns:
      - '*'
    multi-ecosystem-group: app-modernization
