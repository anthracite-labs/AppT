# CodeRabbit configuration for AppT (docs/architecture/release.md, Issue #56).
#
# Independent reasoning layer for pull request reviews and pre-merge checks.
# Pre-merge checks begin in warning mode so their signal can be observed
# before promotion to blocking/error.

language: "en-US"

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    drafts: false
    incremental_reviews: true
  slop_detection:
    enabled: true
    include_all_authors: true
  pre_merge_checks:
    issue_assessment:
      mode: "warning"
  custom_checks:
    - name: "Issue/spec completeness"
      mode: "warning"
      instructions: >-
        The pull request must satisfy its linked Issue completely and must not
        add unrelated scope, speculative abstractions, or features outside the
        work order.
    - name: "Verification integrity"
      mode: "warning"
      instructions: >-
        No accepted verification gate may be removed or weakened without its
        proven replacement. No skipped or disabled tests, blanket suppressions,
        unreviewed generated baselines, placeholder TODOs, stubs, or fake
        implementations are permitted to satisfy acceptance criteria.
    - name: "Architecture/privacy/supply-chain integrity"
      mode: "warning"
      instructions: >-
        The diff must preserve documented module boundaries, privacy rules,
        no-telemetry invariants, exact version catalog pinning, and must not add
        unreviewed dependencies or actions or bypass dependency verification.
