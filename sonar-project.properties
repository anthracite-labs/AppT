# SonarQube Cloud configuration for AppT (docs/architecture/release.md, Issue #56).
# CI-based analysis with imported Kover and Jest LCOV coverage evidence.

sonar.projectKey=anthracite-labs_AppT
sonar.organization=anthracite-labs
sonar.projectName=AppT

# Source and test roots across Android and Backend
sonar.sources=app/src/main,samsung/src/main,backend/src
sonar.tests=app/src/test,backend/test

# Compiled binaries for JVM bytecode analysis
sonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug

# Coverage reports imported from CI
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml,app/build/reports/kover/report.xml,app/build/reports/kover/reportDebug.xml,build/reports/kover/reportDebug.xml
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Fail the CI scanner step if the Quality Gate fails
sonar.qualitygate.wait=true
