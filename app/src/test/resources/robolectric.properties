# Compose needs Robolectric's native graphics mode to lay out and measure real
# nodes. The touch-target assertions (assertTouchWidthIsAtLeast /
# assertTouchHeightIsAtLeast) and assertIsDisplayed read measured bounds, so
# without this they would not be meaningfully evaluated.
robolectric.graphicsMode=NATIVE

# Pin the emulated SDK so unit-test behaviour does not drift with the compile
# SDK. 34 has Robolectric android-all coverage; the production baseline
# (minSdk 29 / target 36) is unaffected by this test-only setting.
sdk=34
